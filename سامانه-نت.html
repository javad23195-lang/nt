<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سامانه نگهداری و تعمیرات</title>
<style>
:root{
  --ink:#14181C; --steel:#1C232A; --rule:#39444F; --dim:#8C99A5; --paper:#EDF1F3;
  --signal:#4EA8DE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--paper);
  font-family:"Vazirmatn","IRANSans","Segoe UI",Tahoma,sans-serif;
  display:flex;flex-direction:column}

/* ---------- نوار بالا ---------- */
.topbar{flex:none;background:var(--steel);border-bottom:1px solid var(--rule);
  padding:9px 10px 0;padding-top:calc(9px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:9px;padding:0 4px 9px}
.brand .lg{color:var(--signal);font-size:1.05rem}
.brand .tt{font-weight:800;font-size:.97rem;flex:1;line-height:1.3}
.brand .dt{font-size:.72rem;color:var(--dim);font-weight:400}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--rule);
  background:rgba(0,0,0,.25);color:var(--dim);font:inherit;font-size:.83rem;font-weight:700;
  padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;position:relative}
.tab .i{font-size:.9rem;color:var(--tc)}
.tab.on{background:var(--tc);border-color:var(--tc);color:#0C1216}
.tab.on .i{color:#0C1216}
.tab .n{position:absolute;top:-3px;inset-inline-end:-3px;min-width:17px;height:17px;
  border-radius:9px;background:#C0392B;color:#fff;font-size:.63rem;font-weight:800;
  display:none;align-items:center;justify-content:center;padding:0 4px}
.tab .n.show{display:flex}
.tab.on .n{background:#0C1216;color:#fff}

/* ---------- محتوا ---------- */
.stage{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--ink)}
iframe.on{display:block}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:.9rem}
</style>
</head>
<body>

  </div>
  <div class="tabs" id="tabs"></div>
</div>

  const b=document.createElement('button');
  b.className='tab'; b.style.setProperty('--tc',doc.color);
  b.innerHTML=`<span class="i">${doc.icon}</span>${doc.name}<span class="n" id="badge${i}"></span>`;
  b.addEventListener('click',()=>show(i));
  $('tabs').appendChild(b); tabs.push(b);

  const fr=document.createElement('iframe');
  fr.setAttribute('title',doc.name);
  fr.setAttribute('loading','lazy');
  $('stage').appendChild(fr); frames.push(fr);
});

function srcFor(i){
  // srcdoc تا هیچ فایل بیرونی لازم نباشد
  return decodeURIComponent(escape(atob(DOCS[i].b64)));
}
function show(i){
  if(active===i) return;
  if(!frames[i].dataset.loaded){
    frames[i].srcdoc = srcFor(i);
    frames[i].dataset.loaded='1';
  }
  frames.forEach((f,k)=>f.classList.toggle('on',k===i));
  tabs.forEach((t,k)=>t.classList.toggle('on',k===i));
  active=i;
  const l=$('load'); if(l) l.remove();
  try{ localStorage.setItem('nt_lasttab',String(i)); }catch(e){}
  setTimeout(badges,400);
}
function badges(){
  KEYS.forEach((k,i)=>{
    const n=pending(k), el=$('badge'+i);
    if(!el) return;
    el.textContent=n?fa(n):'';
    el.classList.toggle('show',n>0);
  });
}

let start=0;
try{ const s=localStorage.getItem('nt_lasttab'); if(s!==null && DOCS[+s]) start=+s; }catch(e){}
show(start);
badges();
setInterval(badges,3000);
window.addEventListener('focus',badges);
</script>
</body>
