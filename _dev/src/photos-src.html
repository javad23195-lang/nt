<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>عکس‌ها</title>
<style>
:root{--bg:#EEF1F4;--card:#FFFFFF;--ink:#17212B;--dim:#51606E;--rule:#D5DCE3;--line:#9AA8B5;--acc:#0B5C7A;--wbg:#FFF1DB;--wink:#7A4300;--wline:#E0A75E;--del:#A32018;--delbg:#FBE5E2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"Vazirmatn","IRANSans","Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.7;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{padding:14px 0 12px;padding-top:calc(14px + env(safe-area-inset-top))}
h1{margin:0;font-size:1.3rem;font-weight:800;line-height:1.4}
.sub{margin:0;font-size:.85rem;color:var(--dim)}
.bar{display:flex;gap:8px;margin-top:12px}
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;flex:1}
.btn.s{min-height:40px;padding:0 12px;font-size:.88rem}
.btn.d{color:var(--del);border-color:var(--del)}
.btn.d.arm{background:var(--del);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cp{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:.92rem}
.cp[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.cp small{opacity:.7;margin-inline-start:4px}
.sr{width:100%;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:10px}
.dv{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:60px;padding:8px 14px;margin-top:8px;border:1px solid var(--rule);border-radius:14px;background:var(--card);text-align:start}
.dv b{display:block}.dv span{color:var(--dim);font-size:.82rem}
.dv .n{flex:none;min-width:34px;height:28px;border-radius:14px;background:#F3F5F7;border:1px solid var(--rule);display:grid;place-items:center;font-weight:800;font-size:.85rem;padding:0 8px}
.back{margin-top:8px;min-height:48px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--acc);font-weight:800;padding:0 14px;text-align:start}
.pt{margin:16px 0 4px;font-size:1rem;font-weight:800;display:flex;gap:8px;align-items:center}
.pt small{color:var(--dim);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (min-width:600px){.grid{grid-template-columns:repeat(5,1fr)}}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--rule);background:#DDE3E9;padding:0}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .no{display:grid;place-items:center;height:100%;padding:6px;font-size:.72rem;color:var(--dim);text-align:center;line-height:1.4}
.th .dt{position:absolute;inset-inline:0;bottom:0;background:rgba(23,33,43,.62);color:#fff;font-size:.75rem;text-align:center;padding:1px 0}
.bk{margin-top:6px;padding:12px 14px;border:1px solid var(--rule);border-radius:14px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.bk.w{border-color:var(--wline);background:var(--wbg)}
.bk b{display:block}.bk span{font-size:.85rem;color:var(--dim)}
.bk .btn.p{flex:none}
.empty{margin-top:16px;padding:22px 16px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--dim)}
.dlg{position:fixed;inset:0;background:rgba(18,25,33,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.dlg.on{display:flex}
.box{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.box h2{margin:0 0 4px;font-size:1.1rem}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.fld>label{font-size:.82rem;font-weight:700;color:var(--dim)}
.in{min-height:48px;width:100%;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.in.bad{border-color:var(--del);background:var(--delbg)}
.err{color:var(--del);font-weight:700;min-height:1.4em;margin-top:6px}
.row{display:flex;gap:8px;margin-top:12px}
.prev{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.prev img{height:64px;width:64px;object-fit:cover;border-radius:8px;border:1px solid var(--rule)}
.vw{position:fixed;inset:0;background:#0C1218;z-index:55;display:none;flex-direction:column}
.vw.on{display:flex}
.vw .im{flex:1;min-height:0;display:grid;place-items:center;padding:8px}
.vw img{max-width:100%;max-height:100%;object-fit:contain}
.vw .nf{color:#fff;text-align:center;padding:20px}
.vw .ft{background:var(--card);padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
.vw .ft b{display:block}.vw .ft span{color:var(--dim);font-size:.85rem}
.toast{position:fixed;inset-inline:16px;bottom:calc(24px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:#1B2430;color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;display:none;z-index:70}
.toast.on{display:block}.toast.bad{background:var(--del)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>عکس‌ها</h1>
  <p class="sub">عکس هر دستگاه، به تفکیک بخش و قطعه. همه چیز فقط روی همین گوشی می‌ماند.</p>
  <div class="bar"><button type="button" class="btn p" id="pCam">📷 دوربین</button><button type="button" class="btn" id="pNew">از گالری</button></div>
  <input type="file" id="fIn" accept="image/*" multiple hidden>
  <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
</div></header>
<main class="wrap" id="main"></main>

<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dH"><div class="box">
  <h2 id="dH">عکس تازه</h2>
  <div class="prev" id="prev"></div>
  <div class="fld"><label for="fDev">دستگاه</label><input class="in" id="fDev" list="dlDev" autocomplete="off"><datalist id="dlDev"></datalist></div>
  <div class="fld"><label>بخش</label><div class="chips" id="secs"></div>
    <input class="in" id="fSecN" placeholder="بخش دیگر (اختیاری)" autocomplete="off" style="margin-top:6px"></div>
  <div class="fld"><label for="fPart">نام قطعه (مثلاً پمپ باد)</label><input class="in" id="fPart" list="dlPart" autocomplete="off"><datalist id="dlPart"></datalist></div>
  <div class="fld"><label for="fNote">توضیح (اختیاری)</label><input class="in" id="fNote" autocomplete="off"></div>
  <div class="err" id="fErr" role="alert"></div>
  <div class="row"><button type="button" class="btn s" id="fCancel" style="flex:1">انصراف</button><button type="button" class="btn p" id="fSave" style="flex:2">ثبت</button></div>
</div></div>

<div class="vw" id="vw" role="dialog" aria-modal="true">
  <div class="im" id="vIm"></div>
  <div class="ft"><b id="vT"></b><span id="vS"></span>
    <div class="row"><button type="button" class="btn p" id="vSend">ارسال</button><button type="button" class="btn s" id="vEdit">ویرایش</button><button type="button" class="btn s d" id="vDel">حذف</button><button type="button" class="btn s" id="vClose">بستن</button></div></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY='nt_photos_v1', TAB='عکس‌ها';
const SECS=['برقی','هیدرولیک','سیستم باد','موتور','گیربکس','بدنه و شاسی','لاستیک و ترمز','سایر'];
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const lat=s=>String(s==null?'':s).replace(/[۰-۹]/g,d=>'0123456789'['۰۱۲۳۴۵۶۷۸۹'.indexOf(d)]);
const dkey=s=>lat(s).replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[‌\s\-_]+/g,'').toLowerCase();
function LS(k,def){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?def:v; }catch(e){ return def; } }
function LSset(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
let _t=null; function say(t,bad){ const el=$('toast'); el.textContent=t; el.className='toast on'+(bad?' bad':''); clearTimeout(_t); _t=setTimeout(()=>el.className='toast',2800); }
function jNow(){ try{ const p=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()); const g=t=>p.find(x=>x.type===t).value; return `${g('year')}/${g('month')}/${g('day')}`; }catch(e){ return ''; } }
const P=()=>{ try{ return parent; }catch(e){ return null; } };
const who=()=>{ try{ return (P().ntSync && P().ntSync.myName && P().ntSync.myName())||''; }catch(e){ return ''; } };
const canW=()=>true;   // عکس‌ها فقط روی همین گوشی است و همگام نمی‌شود؛ پس در حالت مشاهده هم کار می‌کند
function devNames(){ try{ const d=(P().ntQr&&P().ntQr.DEVS||[]).map(x=>x.name); if(d.length) return d; }catch(e){} try{ return P().ntStops.TRACKED.slice(); }catch(e){ return []; } }

/* ---------- ذخیره: اطلاعات در localStorage (همگام نمی‌شود)، خود عکس در IndexedDB همین گوشی ---------- */
let photos=LS(KEY,[]); if(!Array.isArray(photos)) photos=[];
function save(){ LSset(KEY,photos); }
function reload(){ const d=LS(KEY,[]); if(Array.isArray(d)){ photos=d; render(); } }
let _db=null;
function db(){ if(_db) return _db; _db=new Promise((res,rej)=>{ try{ const r=indexedDB.open('ntphotos',1); r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('full'); d.createObjectStore('thumb'); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return _db; }
function idb(store,mode,fn){ return db().then(d=>new Promise((res,rej)=>{ const tx=d.transaction(store,mode), s=tx.objectStore(store); const r=fn(s); tx.oncomplete=()=>res(r&&r.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); })); }
const putB=(st,id,b)=>idb(st,'readwrite',s=>s.put(b,id));
const getB=(st,id)=>idb(st,'readonly',s=>s.get(id)).catch(()=>null);
const delB=id=>Promise.all([idb('full','readwrite',s=>s.delete(id)),idb('thumb','readwrite',s=>s.delete(id))]).catch(()=>{});

function shrink(file,max,q){ return new Promise((res,rej)=>{
  const done=src=>{ const w0=src.width||src.naturalWidth, h0=src.height||src.naturalHeight, k=Math.min(1,max/Math.max(w0,h0)), w=Math.round(w0*k), h=Math.round(h0*k);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(src,0,0,w,h);
    c.toBlob(b=>b?res({blob:b,w,h}):rej(new Error('blob')),'image/jpeg',q); };
  const viaImg=()=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{ done(im); URL.revokeObjectURL(u); }; im.onerror=()=>rej(new Error('img')); im.src=u; };
  if(window.createImageBitmap){ createImageBitmap(file,{imageOrientation:'from-image'}).then(done,viaImg); } else viaImg(); }); }

/* ---------- نمایش ---------- */
let curDev='', curSec='', q='';
const urls=new Map();
function thumbURL(id){ if(urls.has(id)) return Promise.resolve(urls.get(id)); return getB('thumb',id).then(b=>{ if(!b) return ''; const u=URL.createObjectURL(b); urls.set(id,u); return u; }); }
const secOf=p=>p.sec||'سایر';
function render(){
  const M=$('main'); const all=photos.filter(p=>p&&p.id);
  if(!curDev){
    const by=new Map(); all.forEach(p=>{ const k=dkey(p.dev); if(!by.has(k)) by.set(k,{n:p.dev,c:0}); by.get(k).c++; });
    let names=devNames().filter(n=>!by.has(dkey(n))).map(n=>({n,c:0}));
    let list=[...by.values()].sort((a,b)=>b.c-a.c).concat(names);
    const qq=dkey(q); if(qq) list=list.filter(x=>dkey(x.n).includes(qq));
    const nb=all.filter(p=>!p.bk).length;
    const bkc=all.length?`<div class="bk${nb?' w':''}">${nb?`<b>${fa(nb)} عکس پشتیبان ندارد</b><span>اگر گوشی گم شود، این عکس‌ها از بین می‌روند. به بله یا تلگرام بفرستید.</span><button type="button" class="btn p" id="bkGo">ارسال پشتیبان${nb>BK_MAX?` (${fa(BK_MAX)} عکس اول)`:''}</button>`:'<b>✓ همه عکس‌ها پشتیبان دارند</b>'}${lastBk.length?`<button type="button" class="btn s" id="bkAgain">ارسال دوباره همین ${fa(lastBk.length)} عکس (برای برنامه دیگر)</button>`:''}</div>`:'';
    M.innerHTML=bkc+`<input class="sr" id="sr" placeholder="جستجوی دستگاه…" value="${esc(q)}" autocomplete="off">`+
      (all.length?'':'<div class="empty"><b>هنوز عکسی نیست.</b><br>با «دوربین» شروع کنید.</div>')+
      list.map(x=>`<button type="button" class="dv" data-dev="${esc(x.n)}"><span><b>${esc(x.n)}</b></span><span class="n">${x.c?fa(x.c):'—'}</span></button>`).join('');
    const s=$('sr'); s.addEventListener('input',()=>{ q=s.value; const pos=s.selectionStart; render(); const n=$('sr'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} });
    return; }
  const mine=all.filter(p=>dkey(p.dev)===dkey(curDev));
  const secs=[...new Set(mine.map(secOf))]; if(curSec && !secs.includes(curSec)) curSec='';
  const shown=curSec?mine.filter(p=>secOf(p)===curSec):mine;
  const parts=[...new Set(shown.map(p=>p.part||'بدون نام قطعه'))].sort((a,b)=>a.localeCompare(b,'fa'));
  M.innerHTML=`<button type="button" class="back" id="back">→ برگشت به فهرست دستگاه‌ها</button><h2 style="margin:0;font-size:1.1rem">${esc(curDev)} <small style="color:var(--dim);font-weight:400">${fa(mine.length)} عکس</small></h2>`+
    `<div class="chips"><button type="button" class="cp" data-sec="" aria-pressed="${!curSec}">همه</button>${secs.map(s=>`<button type="button" class="cp" data-sec="${esc(s)}" aria-pressed="${curSec===s}">${esc(s)}<small>${fa(mine.filter(p=>secOf(p)===s).length)}</small></button>`).join('')}</div>`+
    (mine.length?'':'<div class="empty">برای این دستگاه عکسی نیست.</div>')+
    parts.map(pn=>{ const ps=shown.filter(p=>(p.part||'بدون نام قطعه')===pn).sort((a,b)=>(b.ts||0)-(a.ts||0));
      return `<div class="pt">${esc(pn)} <small>${fa(ps.length)}</small></div><div class="grid">${ps.map(p=>`<button type="button" class="th" data-id="${esc(p.id)}" aria-label="${esc(pn)}"><span class="no" data-ph="${esc(p.id)}">…</span><span class="dt">${esc(lat(p.date||'').slice(5))}</span></button>`).join('')}</div>`; }).join('')+
    (shown.length>1?`<div class="row"><button type="button" class="btn s" id="sendAll" style="flex:1">ارسال همه عکس‌های این ${curSec?'بخش':'دستگاه'}</button></div>`:'');
  M.querySelectorAll('[data-ph]').forEach(el=>{ const id=el.dataset.ph; thumbURL(id).then(u=>{ if(u) el.outerHTML=`<img alt="" src="${u}">`; else el.textContent='روی گوشی دیگری است'; }); });
}
$('main').addEventListener('click',e=>{
  const d=e.target.closest('[data-dev]'); if(d){ enterDev(d.dataset.dev); return; }
  if(e.target.closest('#back')){ curDev=''; curSec=''; render(); window.scrollTo(0,0); try{ if(history.state&&history.state.ntph) history.back(); }catch(x){} return; }
  const c=e.target.closest('[data-sec]'); if(c){ curSec=c.dataset.sec; render(); return; }
  const t=e.target.closest('[data-id]'); if(t){ openViewer(t.dataset.id); return; }
  if(e.target.closest('#sendAll')) sendMany();
  if(e.target.closest('#bkGo')) backup(false);
  if(e.target.closest('#bkAgain')) backup(true);
});

function enterDev(n){ const was=!!curDev; curDev=n; curSec=''; render(); window.scrollTo(0,0); if(!was){ try{ history.pushState({ntph:1},''); }catch(x){} } }
/* دکمه «برگشت» گوشی هم از صفحه دستگاه به فهرست برمی‌گردد */
window.addEventListener('popstate',()=>{ if(curDev){ curDev=''; curSec=''; render(); window.scrollTo(0,0); } });

/* ---------- ارسال (منوی اشتراک گوشی؛ برچسب‌دار تا در بله/تلگرام جدا جدا پیدا شود) ---------- */
const tag=s=>'#'+String(s||'').trim().replace(/[\s\-‌]+/g,'_').replace(/[^\w؀-ۿ]/g,'');
function caption(p){ return [p.dev,p.sec,p.part,p.date].filter(Boolean).join(' · ')+(p.note?'\n'+p.note:'')+'\n'+[p.dev,p.sec,p.part].filter(Boolean).map(tag).join(' '); }
function shareFiles(files,text,title){
  try{ if(navigator.canShare && navigator.canShare({files})) return navigator.share({files,text,title}).catch(e=>{ if(!(e&&e.name==='AbortError')) throw e; }); }catch(e){}
  files.forEach(f=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); });
  say('گوشی منوی اشتراک ندارد؛ عکس دانلود شد'); return Promise.resolve();
}
/* ---------- پشتیبان: عکس‌هایی که هنوز فرستاده نشده‌اند، با یک ضربه به بله یا تلگرام ---------- */
const BK_MAX=20; let lastBk=[];
async function backup(again){
  const list=again?lastBk.map(id=>photos.find(p=>p.id===id)).filter(Boolean):photos.filter(p=>p&&p.id&&!p.bk).sort((a,b)=>(a.ts||0)-(b.ts||0)).slice(0,BK_MAX);
  const pairs=(await Promise.all(list.map(async p=>({p,f:await fileOf(p)})))).filter(x=>x.f);
  if(!pairs.length){ say('عکسی روی این گوشی نیست',true); return; }
  const files=pairs.map(x=>x.f), lines=[...new Set(pairs.map(x=>[x.p.dev,x.p.sec,x.p.part].filter(Boolean).join(' · ')))];
  const text='پشتیبان عکس‌ها — '+jNow()+'\n'+lines.slice(0,15).join('\n')+'\n'+[...new Set(pairs.map(x=>tag(x.p.dev)))].join(' ');
  window.__shared=files;
  let sent=false;
  try{ if(navigator.canShare && navigator.canShare({files})){ await navigator.share({files,text,title:'پشتیبان عکس‌ها'}); sent=true; } }
  catch(e){ if(e&&e.name==='AbortError'){ say('ارسال لغو شد'); return; } }
  if(!sent){ files.forEach(f=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); }); }
  const d=jNow(); pairs.forEach(x=>{ if(!x.p.bk) x.p.bk=d; }); save(); lastBk=pairs.map(x=>x.p.id); render();
  say(sent?`${fa(files.length)} عکس فرستاده شد`:`${fa(files.length)} عکس دانلود شد`);
}
const fname=p=>(p.dev+'_'+(p.sec||'')+'_'+(p.part||'')+'_'+lat(p.date||'').replace(/\//g,'-')).replace(/[\\/:*?"<>|\s]+/g,'_')+'.jpg';
async function fileOf(p){ const b=await getB('full',p.id); return b?new File([b],fname(p),{type:'image/jpeg'}):null; }
async function sendOne(p){ const f=await fileOf(p); if(!f){ say('این عکس روی گوشی دیگری است',true); return; } window.__shared=[f]; await shareFiles([f],caption(p),p.dev); window.__sentOne=1; }
async function sendMany(){
  const mine=photos.filter(p=>p&&dkey(p.dev)===dkey(curDev)&&(!curSec||secOf(p)===curSec)); const fs=(await Promise.all(mine.map(fileOf))).filter(Boolean);
  if(!fs.length){ say('عکسی روی این گوشی نیست',true); return; }
  const text=[curDev,curSec].filter(Boolean).join(' · ')+'\n'+[curDev,curSec].filter(Boolean).map(tag).join(' ');
  window.__shared=fs; await shareFiles(fs,text,curDev);
}

/* ---------- نمایش بزرگ ---------- */
let vid='', armDel='';
async function openViewer(id){
  const p=photos.find(x=>x.id===id); if(!p) return; vid=id; armDel=''; $('vDel').textContent='حذف'; $('vDel').classList.remove('arm');
  $('vT').textContent=[p.sec,p.part].filter(Boolean).join(' · ')||p.dev; $('vS').textContent=p.dev+' · '+lat(p.date||'')+(p.by?' · '+p.by:'')+(p.note?' — '+p.note:'');
  $('vIm').innerHTML='<div class="nf">…</div>'; $('vw').classList.add('on'); $('vSend').hidden=false;
  const b=await getB('full',id); if(vid!==id) return;
  if(b){ const u=URL.createObjectURL(b); $('vIm').innerHTML=`<img alt="" src="${u}">`; } else { $('vIm').innerHTML='<div class="nf">این عکس روی گوشی دیگری ثبت شده و اینجا نیست.<br>فقط اطلاعات آن همگام شده است.</div>'; $('vSend').hidden=true; }
  $('vEdit').hidden=$('vDel').hidden=!canW();
}
function closeViewer(){ $('vw').classList.remove('on'); vid=''; $('vIm').innerHTML=''; }
$('vClose').addEventListener('click',closeViewer);
$('vSend').addEventListener('click',()=>{ const p=photos.find(x=>x.id===vid); if(p) sendOne(p); });
$('vEdit').addEventListener('click',()=>{ const p=photos.find(x=>x.id===vid); if(p){ closeViewer(); openForm(null,p); } });
$('vDel').addEventListener('click',()=>{
  if(armDel!==vid){ armDel=vid; $('vDel').textContent='حذف؟'; $('vDel').classList.add('arm'); setTimeout(()=>{ if(armDel===vid){ armDel=''; $('vDel').textContent='حذف'; $('vDel').classList.remove('arm'); } },3000); return; }
  const id=vid; photos=photos.filter(x=>x.id!==id); save(); delB(id); if(urls.has(id)){ URL.revokeObjectURL(urls.get(id)); urls.delete(id); } closeViewer(); render(); say('حذف شد'); });

/* ---------- ثبت عکس تازه / ویرایش ---------- */
let pend=[], editP=null, secSel='';
function fillLists(){
  const mk=(id,a)=>{ $(id).innerHTML=a.map(x=>`<option value="${esc(x)}">`).join(''); };
  mk('dlDev',[...new Set(photos.map(p=>p.dev).filter(Boolean).concat(devNames()))]);
  mk('dlPart',[...new Set(photos.map(p=>p.part).filter(Boolean))]);
}
function secList(){ return [...new Set(SECS.slice(0,-1).concat(photos.map(p=>p.sec).filter(Boolean),['سایر']))]; }
function drawSecs(){ $('secs').innerHTML=secList().map(s=>`<button type="button" class="cp" data-s="${esc(s)}" aria-pressed="${secSel===s}">${esc(s)}</button>`).join(''); }
$('secs').addEventListener('click',e=>{ const b=e.target.closest('[data-s]'); if(!b) return; secSel=b.dataset.s; $('fSecN').value=''; drawSecs(); });
function openForm(files,p){
  pend=files||[]; editP=p||null; secSel=p?secOf(p):(curSec||''); fillLists(); drawSecs();
  $('dH').textContent=p?'ویرایش عکس':'عکس تازه'; $('fErr').textContent=''; $('fSecN').value='';
  $('fDev').value=p?p.dev:(curDev||''); $('fPart').value=p?(p.part||''):''; $('fNote').value=p?(p.note||''):'';
  $('prev').innerHTML=''; $('prev').hidden=!pend.length;
  pend.slice(0,12).forEach(f=>{ const u=URL.createObjectURL(f); const im=new Image(); im.src=u; $('prev').appendChild(im); });
  if(pend.length>12){ const s=document.createElement('span'); s.textContent='+'+fa(pend.length-12); $('prev').appendChild(s); }
  $('dlg').classList.add('on'); try{ (curDev?$('fPart'):$('fDev')).focus(); }catch(e){}
}
function closeForm(){ $('dlg').classList.remove('on'); pend=[]; editP=null; $('fIn').value=''; $('fCam').value=''; }
$('pNew').addEventListener('click',()=>$('fIn').click());
$('pCam').addEventListener('click',()=>$('fCam').click());
function picked(inp){ const fs=[...inp.files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic)$/i.test(f.name)); if(fs.length) openForm(fs); }
$('fIn').addEventListener('change',()=>picked($('fIn')));
$('fCam').addEventListener('change',()=>picked($('fCam')));
$('fCancel').addEventListener('click',closeForm);
$('dlg').addEventListener('click',e=>{ if(e.target===$('dlg')) closeForm(); });
$('fSave').addEventListener('click',async()=>{
  const dev=$('fDev').value.trim(), sec=($('fSecN').value.trim()||secSel||'سایر'), part=$('fPart').value.trim(), note=$('fNote').value.trim();
  $('fDev').classList.remove('bad'); if(!dev){ $('fDev').classList.add('bad'); $('fErr').textContent='دستگاه را بنویسید'; try{ $('fDev').focus(); }catch(e){} return; }
  if(editP){ Object.assign(editP,{dev,sec,part,note}); save(); closeForm(); enterDev(dev); say('ذخیره شد'); return; }
  $('fSave').disabled=true; $('fSave').textContent='در حال ذخیره…';
  let ok=0, bad=0; const date=jNow(), by=who();
  for(const f of pend){ try{
    const a=await shrink(f,1280,.8), t=await shrink(f,256,.7);
    const id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    await putB('full',id,a.blob); await putB('thumb',id,t.blob);
    photos.push({id,dev,sec,part,note,date,by,ts:Date.now(),w:a.w,h:a.h}); ok++;
  }catch(e){ bad++; } }
  save(); $('fSave').disabled=false; $('fSave').textContent='ثبت'; closeForm(); enterDev(dev);
  say(bad?`${fa(ok)} عکس ثبت شد، ${fa(bad)} عکس ثبت نشد`:`${fa(ok)} عکس ثبت شد`, !!bad);
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
});
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if($('vw').classList.contains('on')) closeViewer(); else if($('dlg').classList.contains('on')) closeForm(); });

/* «عکس تازه» از صفحه دستگاه */
function consumeDraft(){ try{ const d=parent.ntPhotoDraft; if(!d||!d.dev) return; parent.ntPhotoDraft=null; enterDev(String(d.dev)); }catch(e){} }
window.addEventListener('message',e=>{ if(!e||!e.data||e.data.nt!=='show') return; if($('dlg').classList.contains('on')||$('vw').classList.contains('on')) return; reload(); consumeDraft(); });

render(); setTimeout(consumeDraft,300);
</script>
