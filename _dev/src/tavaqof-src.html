<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>گزارش توقف شیفت</title>
<style>
:root{
  --bg:#EEF1F4; --card:#FFFFFF; --ink:#17212B; --dim:#51606E; --rule:#D5DCE3; --line:#9AA8B5;
  --acc:#0B5C7A; --acc2:#08465D; --ok:#17663F; --okbg:#E4F2EA;
  --wbg:#FFF1DB; --wink:#7A4300; --wline:#E0A75E; --del:#A32018;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"Vazirmatn","IRANSans","Segoe UI",Tahoma,sans-serif;
  font-size:16px;line-height:1.7;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}

/* سربرگ */
header{background:var(--card);border-bottom:1px solid var(--rule);padding:14px 0 12px;padding-top:calc(14px + env(safe-area-inset-top))}
h1{margin:0;font-size:1.25rem;font-weight:800;line-height:1.4}
.sub{margin:0;font-size:.85rem;color:var(--dim)}

/* تاریخ و شیفت */
.day{display:flex;align-items:center;gap:8px;margin-top:14px}
.day .d{flex:1;min-width:0;text-align:center;font-weight:700;font-size:1rem}
.day .d small{display:block;font-size:.78rem;font-weight:500;color:var(--dim)}
.ib{flex:none;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:var(--card);
  border:1px solid var(--line);border-radius:12px}
.seg{display:flex;gap:2px;padding:2px;background:#DDE3E9;border-radius:12px;margin-top:10px}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--dim);font-size:.95rem;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(23,33,43,.12)}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.fld>label,.fld>.lb{font-size:.82rem;font-weight:700;color:var(--dim)}
.in{min-height:48px;width:100%;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
textarea.in{padding:10px 14px;min-height:76px;resize:vertical;line-height:1.7}
.in.bad{border-color:var(--del);border-width:2px}
.err{display:none;font-size:.82rem;font-weight:700;color:var(--del)}
.err.show{display:block}

/* خلاصه و لیست */
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 8px}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:14px;background:var(--card);
  border:1px solid var(--rule);font-size:.82rem;font-weight:700;white-space:nowrap}
.chip.w{background:var(--wbg);border-color:var(--wline);color:var(--wink)}
.chip.g{background:var(--okbg);border-color:#9CCBB0;color:var(--ok)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--dim);font-size:.95rem}
.empty b{display:block;color:var(--ink);font-size:1rem}
.st{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.st.open{border-color:var(--wline);border-inline-start:5px solid #C77A1A}
.st h3{margin:0;font-size:1.02rem;font-weight:800;line-height:1.5;overflow-wrap:anywhere}
.st .tm{font-size:.95rem;margin-top:2px}
.st .tm b{font-weight:700}
.st .why{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:.88rem;color:var(--dim)}
.st .acts{display:flex;gap:8px;margin-top:10px}
.bt{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:.92rem;font-weight:700}
.bt.go{background:var(--acc);border-color:var(--acc);color:#fff}
.bt.del{flex:none;padding:0 14px;color:var(--del);border-color:#D9B4B0}
.bt.del.armed{background:var(--del);border-color:var(--del);color:#fff}

/* نوار پایین */
.obar{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--rule);
  padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:10}
.obar .wrap{display:flex;gap:8px}
.big{flex:1.25;min-height:52px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:1rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px}
.big:active{background:var(--acc2)}
.big2{flex:1;min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:.98rem;font-weight:700}

/* فرم تمام‌صفحه */
.sheet{position:fixed;inset:0;z-index:30;background:var(--card);display:none;flex-direction:column}
.sheet.on{display:flex}
.sh{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 16px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--rule)}
.sh h2{margin:0;font-size:1.15rem;font-weight:800}
.sh .x{width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center}
.sb{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sb .wrap{padding-bottom:20px}
.sf{border-top:1px solid var(--rule);padding:10px 0 calc(12px + env(safe-area-inset-bottom))}
.sf .wrap{display:flex;gap:8px}

/* انتخاب دستگاه */
.pick{border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:232px;overflow-y:auto}
.pick.bad{border-color:var(--del);border-width:2px}
.pick button{display:block;width:100%;min-height:52px;font-weight:700;padding:6px 14px;text-align:start;background:transparent;border:0;
  border-bottom:1px solid var(--rule);font-size:.98rem;line-height:1.6}
.pick button:last-child{border-bottom:0}
.pick .none{padding:12px 14px;color:var(--dim);font-size:.9rem}
.sel{display:flex;align-items:center;gap:8px;min-height:50px;padding:6px 8px 6px 14px;border:2px solid var(--acc);border-radius:10px;background:#E6F0F4}
.sel b{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:800}
.sel button{flex:none;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:.88rem;font-weight:700}

/* ساعت */
.t2{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:520px){ .t2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px} }
.trow{display:flex;gap:6px}
.trow .in{flex:1;min-width:0;padding:0 10px;text-align:center;direction:ltr;font-weight:700;font-variant-numeric:tabular-nums}
.now{flex:none;min-width:72px;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:.88rem;font-weight:700}
.now:disabled,.in:disabled{opacity:.45}
.durb{margin-top:8px;font-size:.9rem;font-weight:700;color:var(--dim);min-height:1.7em}
.durb.w{color:var(--wink)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:6px;font-size:.95rem}
.chk input{width:22px;height:22px;accent-color:var(--acc)}

/* علت */
.why{display:flex;flex-wrap:wrap;gap:8px}
.why button{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:22px;background:var(--card);font-size:.95rem}
.why button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.grp{font-size:.78rem;color:var(--dim);margin:8px 0 6px}

/* پیش‌نمایش متن */
pre.out{margin:12px 0 0;padding:12px 14px;background:var(--bg);border:1px solid var(--rule);border-radius:12px;white-space:pre-wrap;
  overflow-wrap:anywhere;font:inherit;font-size:.92rem;line-height:1.9;direction:rtl;text-align:start}
.help{font-size:.85rem;color:var(--dim);margin:10px 0 0}

.toast{position:fixed;inset-inline:16px;bottom:calc(92px + env(safe-area-inset-bottom));margin:0 auto;max-width:480px;z-index:50;
  background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:.92rem;font-weight:700;text-align:center;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:none}
.toast.bad{background:var(--del)}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>

<header><div class="wrap">
  <h1>گزارش توقف شیفت</h1>
  <p class="sub">واحد استخراج · هر توقف دستگاه را همان لحظه ثبت کنید</p>
</div></header>

<main class="wrap">
  <div class="day">
    <button type="button" class="ib" id="dPrev" aria-label="روز قبل"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="d" id="dTxt" aria-live="polite"></div>
    <button type="button" class="ib" id="dNext" aria-label="روز بعد"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  </div>
  <div class="seg" id="shift" role="group" aria-label="شیفت">
    <button type="button" data-s="صبح">صبح</button><button type="button" data-s="عصر">عصر</button><button type="button" data-s="شب">شب</button>
  </div>
  <div class="fld">
    <label for="who">نام گزارش‌دهنده</label>
    <input class="in" id="who" autocomplete="name" placeholder="نام و نام خانوادگی">
  </div>

  <div class="sum" id="sum"></div>
  <div id="list"></div>
</main>

<div class="obar"><div class="wrap">
  <button type="button" class="big" id="bNew"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>ثبت توقف</button>
  <button type="button" class="big2" id="bSend">ارسال گزارش</button>
</div></div>

<!-- فرم ثبت توقف -->
<div class="sheet" id="fSheet" role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <div class="sh">
    <button type="button" class="x" id="fClose" aria-label="بستن"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 id="fTitle">ثبت توقف</h2>
  </div>
  <div class="sb"><div class="wrap">
    <div class="fld">
      <span class="lb" id="devLb">دستگاه</span>
      <div id="fSel" class="sel" hidden><b id="fSelT"></b><button type="button" id="fChange">تغییر</button></div>
      <div id="fPickBox">
        <input class="in" id="fQ" autocomplete="off" placeholder="جستجوی دستگاه…" aria-labelledby="devLb" aria-describedby="eDev" style="margin-bottom:6px">
        <div class="pick" id="fPick" role="group" aria-labelledby="devLb"></div>
      </div>
      <span class="err" id="eDev">دستگاه را انتخاب کنید.</span>
    </div>

    <div class="t2">
      <div class="fld">
        <label for="fFrom">ساعت توقف</label>
        <div class="trow"><input class="in" id="fFrom" type="time" aria-describedby="eFrom"><button type="button" class="now" data-now="fFrom">الان</button></div>
      </div>
      <div class="fld">
        <label for="fTo">ساعت شروع دوباره</label>
        <div class="trow"><input class="in" id="fTo" type="time" aria-describedby="eTo"><button type="button" class="now" data-now="fTo">الان</button></div>
      </div>
    </div>
    <span class="err" id="eFrom">ساعت توقف را وارد کنید.</span>
    <span class="err" id="eTo">ساعت شروع دوباره با ساعت توقف یکی است.</span>
    <label class="chk"><input type="checkbox" id="fOpen">هنوز متوقف است</label>
    <div class="durb" id="fDur" aria-live="polite"></div>

    <div class="fld">
      <span class="lb" id="whyLb">علت توقف</span>
      <div id="fWhy" role="group" aria-labelledby="whyLb"></div>
      <span class="err" id="eWhy">علت را انتخاب کنید.</span>
    </div>

    <div class="fld">
      <label for="fNote">توضیح کوتاه <span style="font-weight:400">(اختیاری)</span></label>
      <textarea class="in" id="fNote" placeholder="مثلاً: شیلنگ هیدرولیک جک بوم ترکید"></textarea>
    </div>
  </div></div>
  <div class="sf"><div class="wrap">
    <button type="button" class="big" id="fSave">ذخیره توقف</button>
    <button type="button" class="big2" id="fSaveNext">ذخیره و بعدی</button>
  </div></div>
</div>

<!-- ارسال گزارش -->
<div class="sheet" id="sSheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="sh">
    <button type="button" class="x" id="sClose" aria-label="بستن"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 id="sTitle">ارسال گزارش</h2>
  </div>
  <div class="sb"><div class="wrap">
    <div class="sum" id="sWarn" style="margin-top:12px"></div>
    <pre class="out" id="sOut" tabindex="0" aria-label="متن گزارش"></pre>
    <p class="help" id="sHelp"></p>
  </div></div>
  <div class="sf"><div class="wrap">
    <button type="button" class="big" id="sShare">ارسال</button>
    <button type="button" class="big2" id="sCopy">کپی متن</button>
  </div></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ داده‌های ثابت ============ */
/* نام دستگاه‌ها دقیقاً مثل سامانه نت */
const DEVICES=["بیل مکانیکی کوماتسو PC290","بیل مکانیکی کوماتسو PC400"];
const CAUSES=[
  {g:'خرابی یا تعمیر بیل', L:['خرابی موتور','خرابی هیدرولیک','خرابی برق','زنجیر و زیربندی','پاکت و ناخن','سرویس دوره‌ای','خرابی دیگر']},
  {g:'بیل سالم بود ولی کار نکرد', L:['نبود راننده','نبود سوخت','انتظار کامیون','جابه‌جایی بیل','هوا (باران شدید، مه غلیظ، برف)','سایر']}
];
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const KEY='nt_tavaqof_v1', KNAME='nt_tavaqof_name', KDEV='nt_tavaqof_dev';

/* ============ ابزار ============ */
const $=id=>document.getElementById(id);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
function LS(k,def){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?def:v; }catch(e){ return def; } }
function LSset(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
let _tt=null;
function say(t,bad){ const el=$('toast'); el.textContent=t; el.className='toast on'+(bad?' bad':''); clearTimeout(_tt); _tt=setTimeout(()=>el.className='toast',2800); }
function norm(s){ return String(s||'').replace(/[يى]/g,'ی').replace(/ك/g,'ک')
  .replace(/[۰-۹]/g,d=>String(d.charCodeAt(0)-0x06F0)).replace(/[‌\s\-_]+/g,'').toLowerCase(); }
function nowHM(){ const d=new Date(); return p2(d.getHours())+':'+p2(d.getMinutes()); }
function mins(t){ const m=/^(\d{1,2}):(\d{2})$/.exec(t||''); return m?(+m[1])*60+(+m[2]):null; }
/** مدت توقف به دقیقه؛ اگر ساعت پایان کوچک‌تر باشد، یعنی از نیمه‌شب گذشته است */
function dur(a,b){ const x=mins(a), y=mins(b); if(x===null||y===null) return null; return (y-x+1440)%1440; }
function durTxt(m){ const h=Math.floor(m/60), r=m%60; return h?(r?`${fa(h)} ساعت و ${fa(r)} دقیقه`:`${fa(h)} ساعت`):`${fa(r)} دقیقه`; }
function durHM(m){ return Math.floor(m/60)+':'+p2(m%60); }

/* ============ تاریخ شمسی ============ */
let gDate=new Date(); gDate.setHours(12,0,0,0);
function jOf(d){
  try{
    const p=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
    const g=t=>p.find(x=>x.type===t).value; return {y:+g('year'),m:+g('month'),d:+g('day')};
  }catch(e){ return null; }
}
function jKey(d){ const j=jOf(d); return j?`${j.y}/${p2(j.m)}/${p2(j.d)}`:d.toISOString().slice(0,10); }
function wdName(d){ return ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'][d.getDay()]; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

/* ============ وضعیت ============ */
let db=LS(KEY,{}); if(!db || typeof db!=='object' || Array.isArray(db)) db={};
let shift=(()=>{ const h=new Date().getHours(); return h>=6&&h<14?'صبح':(h>=14&&h<22?'عصر':'شب'); })();
function recKey(){ return jKey(gDate)+'|'+shift; }
function rec(){ const k=recKey(); if(!db[k]) db[k]={stops:[],sent:false}; return db[k]; }
function save(touch){
  if(touch) rec().sent=false;
  // گزارش‌های خالی و قدیمی‌تر از ۳۰ گزارش آخر نگه داشته نمی‌شوند
  Object.keys(db).forEach(k=>{ if(k!==recKey() && !(db[k].stops||[]).length) delete db[k]; });
  const ks=Object.keys(db).sort(); while(ks.length>30) delete db[ks.shift()];
  LSset(KEY,db);
}

/* ============ صفحه اصلی ============ */
function render(){
  const today=sameDay(gDate,new Date()), j=jOf(gDate);
  $('dTxt').innerHTML=`${today?'امروز · ':''}${wdName(gDate)} ${j?fa(j.d)+' '+MONTHS[j.m-1]+' '+fa(j.y):''}<small class="num">${fa(jKey(gDate))}</small>`;
  $('dNext').disabled=today; $('dNext').style.opacity=today?.35:1;
  document.querySelectorAll('#shift button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===shift?'true':'false'));
  const R=rec(), S=R.stops;
  const tot=S.reduce((a,s)=>a+(s.to?dur(s.from,s.to):0),0), open=S.filter(s=>!s.to).length;
  $('sum').innerHTML = S.length
    ? `<span class="chip">${fa(S.length)} توقف</span>`
      + (tot?`<span class="chip">جمع ${durTxt(tot)}</span>`:'')
      + (open?`<span class="chip w">${fa(open)} دستگاه هنوز متوقف</span>`:'')
      + (R.sent?`<span class="chip g">ارسال شد</span>`:'')
    : (R.sent?`<span class="chip g">ارسال شد — بدون توقف</span>`:'');
  $('list').innerHTML = S.length ? S.map(s=>{
    const m=s.to?dur(s.from,s.to):null;
    return `<article class="st${s.to?'':' open'}">
      <h3>${esc(s.dev)}</h3>
      <div class="tm num">${s.to
        ? `از <b>${fa(s.from)}</b> تا <b>${fa(s.to)}</b>${mins(s.to)<mins(s.from)?' (روز بعد)':''} — مدت ${durTxt(m)}`
        : `از <b>${fa(s.from)}</b> — هنوز متوقف است`}</div>
      <div class="why"><span class="chip">${esc(s.cause)}</span>${s.note?`<span>${esc(s.note)}</span>`:''}</div>
      <div class="acts">
        ${s.to?'':`<button type="button" class="bt go" data-run="${s.id}">راه افتاد</button>`}
        <button type="button" class="bt" data-ed="${s.id}">ویرایش</button>
        <button type="button" class="bt del" data-del="${s.id}">حذف</button>
      </div></article>`; }).join('')
    : `<div class="empty"><b>هنوز توقفی ثبت نشده</b>اگر دستگاهی ایستاد، «ثبت توقف» را بزنید.<br>اگر شیفت بدون توقف بود، «ارسال گزارش» را بزنید.</div>`;
  document.querySelectorAll('[data-run]').forEach(b=>b.addEventListener('click',()=>{
    const s=rec().stops.find(x=>x.id===b.dataset.run); if(!s) return;
    const t=nowHM(); if(t===s.from){ say('ساعت شروع دوباره با ساعت توقف یکی است — با «ویرایش» درست کنید',true); return; }
    s.to=t; save(true); render(); say(`راه افتاد — ساعت ${fa(t)}`); }));
  document.querySelectorAll('[data-ed]').forEach(b=>b.addEventListener('click',()=>formOpen(b.dataset.ed)));
  document.querySelectorAll('[data-del]').forEach(b=>{ let armed=false,t=null;
    b.addEventListener('click',()=>{
      if(!armed){ armed=true; b.textContent='حذف شود؟'; b.classList.add('armed'); t=setTimeout(()=>{ armed=false; b.textContent='حذف'; b.classList.remove('armed'); },4000); return; }
      clearTimeout(t); const R=rec(); R.stops=R.stops.filter(x=>x.id!==b.dataset.del); save(true); render(); say('حذف شد'); }); });
}
function shiftDay(n){ const d=new Date(gDate); d.setDate(d.getDate()+n); if(d>new Date() && !sameDay(d,new Date())) return; gDate=d; render(); }
$('dPrev').addEventListener('click',()=>shiftDay(-1));
$('dNext').addEventListener('click',()=>shiftDay(1));
document.querySelectorAll('#shift button').forEach(b=>b.addEventListener('click',()=>{ shift=b.dataset.s; render(); }));
$('who').value=LS(KNAME,'')||'';
$('who').addEventListener('input',()=>LSset(KNAME,$('who').value.trim()));

/* ============ فرم ثبت توقف ============ */
let editId=null, fDev='', fCause='';
function devOrder(){
  const f=LS(KDEV,{})||{};
  return DEVICES.map((d,i)=>({d,i,n:f[d]||0})).sort((a,b)=>b.n-a.n||a.i-b.i).map(x=>x.d);
}
function pickDraw(){
  const SHORT=DEVICES.length<=6;                 // لیست کوتاه: بدون جستجو و بدون نام دستی
  $('fQ').hidden=SHORT;
  const q=SHORT?'':norm($('fQ').value), all=SHORT?DEVICES:devOrder(), L=q?all.filter(d=>norm(d).includes(q)):all, raw=SHORT?'':$('fQ').value.trim();
  $('fPick').innerHTML = (L.map(d=>`<button type="button" data-d="${esc(d)}">${esc(d)}</button>`).join('')
    + ((raw && !all.some(d=>norm(d)===q))?`<button type="button" data-d="${esc(raw)}">دستگاه دیگر: «${esc(raw)}»</button>`:''))
    || '<div class="none">دستگاهی پیدا نشد.</div>';
  $('fPick').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>devSet(b.dataset.d)));
}
function devSet(d){
  fDev=d||''; $('fSel').hidden=!fDev; $('fPickBox').hidden=!!fDev; $('fSelT').textContent=fDev;
  $('fPick').classList.remove('bad'); $('fQ').classList.remove('bad');
  if(fDev){ $('eDev').classList.remove('show'); } else { $('fQ').value=''; pickDraw(); }
}
$('fQ').addEventListener('input',pickDraw);
$('fChange').addEventListener('click',()=>{ devSet(''); const b=$('fQ').hidden?$('fPick').querySelector('button'):$('fQ'); if(b) b.focus(); });
function whyDraw(){
  $('fWhy').innerHTML=CAUSES.map(c=>`<div class="grp">${esc(c.g)}</div><div class="why">${c.L.map(x=>
    `<button type="button" data-c="${esc(x)}" aria-pressed="${x===fCause?'true':'false'}">${esc(x)}</button>`).join('')}</div>`).join('');
  $('fWhy').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ fCause=b.dataset.c; $('eWhy').classList.remove('show'); whyDraw(); }));
}
function durDraw(){
  const a=$('fFrom').value, b=$('fTo').value, el=$('fDur'); el.className='durb';
  $('fTo').disabled=$('fOpen').checked; document.querySelector('[data-now="fTo"]').disabled=$('fOpen').checked;
  if($('fOpen').checked){ el.textContent=a?`از ساعت ${fa(a)} متوقف است. وقتی راه افتاد، «راه افتاد» را بزنید.`:''; return; }
  const m=dur(a,b);
  if(m===null){ el.textContent=''; return; }
  if(m===0){ el.textContent=''; return; }
  const next=mins(b)<mins(a);
  el.textContent=`مدت توقف: ${durTxt(m)}`+(next?' — پایان در روز بعد':'');
  if(m>720){ el.className='durb w'; el.textContent+=' · بیش از ۱۲ ساعت است؛ ساعت‌ها را بررسی کنید.'; }
}
['fFrom','fTo','fOpen'].forEach(id=>$(id).addEventListener('input',()=>{ $('eFrom').classList.remove('show'); $('eTo').classList.remove('show'); $(id).classList.remove('bad'); durDraw(); }));
$('fOpen').addEventListener('change',()=>{ if($('fOpen').checked) $('fTo').value=''; durDraw(); });
document.querySelectorAll('.now').forEach(b=>b.addEventListener('click',()=>{ const el=$(b.dataset.now); el.value=nowHM(); el.dispatchEvent(new Event('input')); }));
function formOpen(id){
  editId=id||null;
  const s=id?rec().stops.find(x=>x.id===id):null;
  $('fTitle').textContent=s?'ویرایش توقف':'ثبت توقف';
  $('fSaveNext').hidden=!!s;
  $('fQ').value=''; devSet(s?s.dev:''); pickDraw();
  $('fFrom').value=s?s.from:(sameDay(gDate,new Date())?nowHM():'');
  $('fTo').value=s?(s.to||''):'';
  $('fOpen').checked=s?!s.to:true;
  fCause=s?s.cause:''; whyDraw();
  $('fNote').value=s?(s.note||''):'';
  document.querySelectorAll('#fSheet .err').forEach(e=>e.classList.remove('show'));
  document.querySelectorAll('#fSheet .bad').forEach(e=>e.classList.remove('bad'));
  durDraw();
  $('fSheet').classList.add('on'); document.body.style.overflow='hidden';
  $('fSheet').querySelector('.sb').scrollTop=0;
}
function formClose(){ $('fSheet').classList.remove('on'); document.body.style.overflow=''; editId=null; }
$('fClose').addEventListener('click',formClose);
function formSave(next){
  const from=$('fFrom').value, open=$('fOpen').checked, to=open?'':$('fTo').value;
  let ok=true, first=null;
  const bad=(errId,el)=>{ $(errId).classList.add('show'); if(el) el.classList.add('bad'); if(!first) first=el||$(errId); ok=false; };
  if(!fDev) bad('eDev',$('fQ').hidden?$('fPick'):$('fQ'));
  if(mins(from)===null) bad('eFrom',$('fFrom'));
  else if(!open && mins(to)===null){ $('eTo').textContent='ساعت شروع دوباره را وارد کنید، یا «هنوز متوقف است» را بزنید.'; bad('eTo',$('fTo')); }
  else if(!open && dur(from,to)===0){ $('eTo').textContent='ساعت شروع دوباره با ساعت توقف یکی است.'; bad('eTo',$('fTo')); }
  if(!fCause) bad('eWhy',null);
  if(!ok){ try{ first.scrollIntoView({block:'center'}); if(first.focus) first.focus(); }catch(e){} return; }
  const R=rec(), note=$('fNote').value.trim().replace(/\s+/g,' ');
  if(editId){ const s=R.stops.find(x=>x.id===editId); if(s) Object.assign(s,{dev:fDev,from,to,cause:fCause,note}); }
  else R.stops.push({id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),dev:fDev,from,to,cause:fCause,note});
  R.stops.sort((a,b)=>mins(a.from)-mins(b.from));
  const f=LS(KDEV,{})||{}; f[fDev]=(f[fDev]||0)+1; LSset(KDEV,f);
  save(true); render();
  if(next){ say('ذخیره شد — توقف بعدی'); formOpen(null); } else { formClose(); say('توقف ذخیره شد'); }
}
$('fSave').addEventListener('click',()=>formSave(false));
$('fSaveNext').addEventListener('click',()=>formSave(true));
$('bNew').addEventListener('click',()=>formOpen(null));

/* ============ متن گزارش ============ */
/* هر توقف سه خط. بعد از نام دستگاه و قبل از عددها همیشه یک کلمه فارسی می‌آید تا متن در پیام‌رسان به هم نریزد. */
function reportText(){
  const R=rec(), S=R.stops, who=$('who').value.trim(), L=[];
  L.push('گزارش توقف شیفت');
  L.push(`تاریخ: ${jKey(gDate)} — شیفت: ${shift}`);
  L.push(`گزارش‌دهنده: ${who||'—'}`);
  if(!S.length){ L.push('توقف نداشتیم.'); return L.join('\n'); }
  S.forEach((s,i)=>{
    L.push('');
    L.push(`${i+1}) ${s.dev}‏`);
    L.push(s.to ? `از ${s.from} تا ${s.to} — مدت ${durHM(dur(s.from,s.to))}` : `از ${s.from} — هنوز متوقف است`);
    L.push(`علت: ${s.cause}`+(s.note?` — ${s.note}`:''));
  });
  const tot=S.reduce((a,s)=>a+(s.to?dur(s.from,s.to):0),0), open=S.filter(s=>!s.to).length;
  L.push('');
  L.push(`جمع: ${S.length} توقف — مدت ${durHM(tot)}`+(open?` — ${open} دستگاه هنوز متوقف`:''));
  return L.join('\n');
}
function sendOpen(){
  const R=rec(), open=R.stops.filter(s=>!s.to).length, who=$('who').value.trim();
  $('sWarn').innerHTML=(who?'':'<span class="chip w">نام گزارش‌دهنده خالی است</span>')
    + (open?`<span class="chip w">${fa(open)} دستگاه هنوز متوقف است</span>`:'');
  $('sOut').textContent=reportText();
  $('sHelp').textContent = navigator.share
    ? '«ارسال» را بزنید و پیام‌رسان و گیرنده (واحد نگهداری و تعمیرات) را انتخاب کنید.'
    : '«کپی متن» را بزنید. بعد متن را در پیام‌رسان برای واحد نگهداری و تعمیرات بچسبانید.';
  $('sShare').hidden=!navigator.share;
  $('sCopy').className=navigator.share?'big2':'big';
  $('sSheet').classList.add('on'); document.body.style.overflow='hidden';
}
function sendClose(){ $('sSheet').classList.remove('on'); document.body.style.overflow=''; }
function markSent(){ rec().sent=true; save(false); render(); }
async function copyText(t){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,t.length); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }
}
$('bSend').addEventListener('click',sendOpen);
$('sClose').addEventListener('click',sendClose);
$('sCopy').addEventListener('click',async()=>{
  const ok=await copyText(reportText());
  if(ok){ markSent(); say('متن کپی شد — در پیام‌رسان بچسبانید'); }
  else say('کپی نشد — متن را با انگشت انتخاب و کپی کنید',true);
});
$('sShare').addEventListener('click',async()=>{
  try{ await navigator.share({text:reportText()}); markSent(); sendClose(); say('گزارش ارسال شد'); }
  catch(e){ if(!e || e.name!=='AbortError') say('ارسال نشد — «کپی متن» را بزنید',true); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('fSheet').classList.contains('on')) formClose(); else if($('sSheet').classList.contains('on')) sendClose(); } });

render();
</script>
</body>
</html>
