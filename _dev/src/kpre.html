<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>پیش‌فاکتور</title>
<style>
/*KH_COMMON_CSS*/
.iq{border:1px solid var(--rule);border-radius:16px;background:#fff;margin-top:10px;overflow:hidden}
.iq>button.h{display:flex;align-items:center;gap:10px;width:100%;min-height:64px;padding:10px 14px;border:0;background:none;text-align:start}
.iq>button.h .tx{flex:1;min-width:0}
.iq>button.h b{display:block;font-size:.98rem}
.iq>button.h span{font-size:.8rem;color:var(--dim)}
.iq .bd{padding:0 14px 14px;border-top:1px solid #EEF1F4}
.stt{flex:none;font-size:.76rem;font-weight:800;padding:2px 10px;border-radius:10px;background:#EEF1F4;white-space:nowrap}
.stt.wait{background:var(--wabg);color:var(--wa)}.stt.ok{background:var(--okbg);color:var(--ok)}.stt.no{background:var(--badbg);color:var(--bad)}
.cmp{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:10px}
.cmpw{overflow-x:auto;margin:0 -2px}
.cmp th,.cmp td{border:1px solid #E4E9EE;padding:7px 6px;text-align:center;vertical-align:middle}
.cmp th{background:#F5F7F9;font-weight:800;font-size:.8rem}
.cmp td.nm{text-align:start;font-weight:700;background:#FAFBFC}
.cmp td.best{background:var(--okbg);color:var(--ok);font-weight:900}
.cmp td.pick{outline:3px solid var(--nv);outline-offset:-3px}
.cmp tr.tot td{font-weight:900;background:#F5F7F9}
.cmp tr.tot td.best{background:var(--okbg)}
.cmp .na{color:#9AA8B5}
.qt{border:1px dashed #B9C6D2;border-radius:12px;padding:10px 12px;margin-top:10px;background:#FAFBFC}
.qt .pr{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;margin-top:6px}
.qt .pr span{font-size:.88rem}
.qt .pr .in{margin:0;min-height:42px}
.dec{margin-top:10px;padding:10px 12px;border-radius:12px;background:#F5F7F9}
.dec h3{margin:0 0 6px;font-size:.92rem}
.fl{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:.82rem;font-weight:700;margin:4px 0 0 6px}
#fv{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.92);display:flex;align-items:center;justify-content:center;padding:12px}
#fv img{max-width:100%;max-height:100%;border-radius:8px}
#fv button{position:absolute;top:12px;inset-inline-end:12px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="tt"><h1>پیش‌فاکتور</h1><p class="sub" id="hSub">استعلام قیمت از چند فروشنده، مقایسه و تایید مدیر</p></div></header>
<div class="seg" id="seg" role="group" aria-label="بخش">
  <button type="button" data-p="open" aria-pressed="true">جاری</button>
  <button type="button" data-p="new" aria-pressed="false">استعلام تازه</button>
  <button type="button" data-p="old" aria-pressed="false">بسته‌شده</button>
</div>
<button type="button" id="goNew" hidden></button>

<section id="p_new" hidden>
  <div class="card w-only">
    <h2>استعلام تازه</h2>
    <label class="f" for="nT">عنوان (مثلاً «مواد غذایی آبان»)</label>
    <input class="in" id="nT" maxlength="80" autocomplete="off">
    <label class="f" for="nI">اقلام — هر خط یک قلم: نام، بعد تعداد و واحد (اختیاری)</label>
    <textarea class="in" id="nI" rows="5" placeholder="برنج ۱۰ کیسه&#10;روغن ۵ حلب&#10;رب گوجه ۲۰ قوطی"></textarea>
    <button type="button" class="btn p w" id="nSave">ساخت استعلام</button>
    <div class="msg" id="nMsg" role="status"></div>
  </div>
  <div class="card" id="nRo" hidden><div class="empty">اجازه ساخت استعلام ندارید.</div></div>
</section>
<section id="p_open"><div id="oList"></div></section>
<section id="p_old" hidden><div id="cList"></div></section>
</div>
<div id="fv" hidden><img alt="پیوست پیش‌فاکتور"><button type="button" class="btn s" id="fvX">بستن</button></div>
<script>
/*KH_COMMON_JS*/
const PK='nt_kpre_v1', FK='nt_kpre_files_v1', WK='nt_kweek_v1';
const TAB='پیش‌فاکتور', canW=canWT(TAB), AP=canAppr();
if(!canW) document.body.classList.add('ro');
const all=()=>{ const a=LS(PK,[]); return Array.isArray(a)?a.filter(x=>x&&x.id&&Array.isArray(x.items)):[]; };
const files=()=>{ const o=LS(FK,{}); return (o&&typeof o==='object'&&!Array.isArray(o))?o:{}; };
function save(fn){ const A=all(); fn(A); if(!put(PK,A)) return false; drawAll(); return true; }
const ST={'':'پیش‌نویس',wait:'منتظر تایید',ok:'تایید شد',no:'رد شد'};
const UNITS=['عدد','کیسه','حلب','قوطی','کیلوگرم','لیتر','بسته','کارتن','متر','دست','شاخه','گالن'];
/** «برنج ۱۰ کیسه» → {t:'برنج',q:10,u:'کیسه'} */
function parseLine(l){ l=clean(l,120); const m=/^(.*?)[\s\-:]+([\d۰-۹٠-٩.,/]+)\s*([^\d\s]*)$/.exec(l); if(m && m[1].trim()) return {t:m[1].trim(),q:+lat(m[2]).replace(/,/g,'')||'',u:clean(m[3],15)}; return {t:l,q:'',u:''}; }
$('nSave').addEventListener('click',()=>{ const T=clean($('nT').value,80)||('استعلام '+TODAY), L=String($('nI').value).split(/\r?\n/).map(parseLine).filter(x=>x.t);
  if(!L.length){ say('nMsg','اقلام را بنویسید','bad'); return; }
  const id=uid('p'); save(A=>A.push({id,title:T,date:TODAY,by:myName(),items:L.slice(0,60).map(x=>Object.assign({id:uid('i')},x)),quotes:[],st:''}));
  $('nT').value=''; $('nI').value=''; OPEN.add(id); S.set('open'); });
const OPEN=new Set();
/** قیمت کل یک قلم در یک پیش‌فاکتور (قیمت واحد × تعداد) */
const lineTot=(it,q)=>{ const p=q.prices&&q.prices[it.id]; if(p==null||p==='') return null; return (+p)*((+it.q)||1); };
function best(iq){ const per={}, tot={}; iq.items.forEach(it=>{ let b=null; iq.quotes.forEach(q=>{ const v=lineTot(it,q); if(v!=null && (b===null||v<b.v)) b={v,q:q.id}; }); per[it.id]=b; });
  iq.quotes.forEach(q=>{ let s=0, n=0; iq.items.forEach(it=>{ const v=lineTot(it,q); if(v!=null){ s+=v; n++; } }); tot[q.id]={s,full:n===iq.items.length,n}; });
  const fulls=iq.quotes.filter(q=>tot[q.id].full); const bs=fulls.length?fulls.reduce((a,q)=>tot[q.id].s<tot[a.id].s?q:a,fulls[0]):null;
  const mix=iq.items.reduce((a,it)=>a+(per[it.id]?per[it.id].v:0),0);
  return {per,tot,bestSup:bs?bs.id:null,mix}; }
function cmpHTML(iq){ if(!iq.quotes.length) return '<div class="empty">هنوز پیش‌فاکتوری اضافه نشده است.</div>';
  const B=best(iq), dec=iq.dec||{};
  const picked=(it,q)=>iq.st==='ok' && (dec.mode==='sup'?dec.sup===q.id:(dec.per&&dec.per[it.id]===q.id));
  return `<div class="cmpw"><table class="cmp"><thead><tr><th>قلم</th>${iq.quotes.map(q=>`<th>${esc(q.sup)}${q.fid?' 📎':''}</th>`).join('')}</tr></thead><tbody>
    ${iq.items.map(it=>`<tr><td class="nm">${esc(it.t)}${it.q?`<br><small>${fa(it.q)} ${esc(it.u||'')}</small>`:''}</td>${iq.quotes.map(q=>{ const v=lineTot(it,q), p=q.prices&&q.prices[it.id];
      return `<td class="${B.per[it.id]&&B.per[it.id].q===q.id?'best':''}${picked(it,q)?' pick':''}">${v==null?'<span class="na">—</span>':esc(faN(v))+(it.q&&+it.q!==1?`<br><small>واحد ${esc(faN(p))}</small>`:'')}</td>`; }).join('')}</tr>`).join('')}
    <tr class="tot"><td class="nm">جمع</td>${iq.quotes.map(q=>`<td class="${B.bestSup===q.id?'best':''}">${esc(faN(B.tot[q.id].s))}${B.tot[q.id].full?'':`<br><small>ناقص: ${fa(B.tot[q.id].n)} از ${fa(iq.items.length)} قلم</small>`}</td>`).join('')}</tr>
    </tbody></table></div><p class="hint">سبز: ارزان‌ترین. ترکیب بهترین (هر قلم از ارزان‌ترین): <b>${esc(faN(B.mix))}</b> ریال${B.bestSup?`؛ ارزان‌ترین فروشنده کامل: <b>${esc((iq.quotes.find(q=>q.id===B.bestSup)||{}).sup||'')}</b>`:''}.</p>`; }
function quoteForm(iq){ return `<div class="qt w-only" data-qf="${esc(iq.id)}"><b>افزودن پیش‌فاکتور فروشنده</b>
    <div class="row2"><div><label class="f">فروشنده</label><input class="in" data-k="sup" maxlength="80" list="supL" autocomplete="off"></div><div><label class="f">تاریخ</label><input class="in mono dt" data-k="date" value="${esc(TODAY)}" inputmode="numeric"></div></div>
    <label class="f">قیمت واحد هر قلم (ریال؛ خالی = این قلم را ندارد)</label>
    ${iq.items.map(it=>`<div class="pr"><span>${esc(it.t)}${it.q?' — '+fa(it.q)+' '+esc(it.u||''):''}</span><input class="in mono" data-it="${esc(it.id)}" inputmode="numeric" aria-label="قیمت ${esc(it.t)}"></div>`).join('')}
    <label class="f">پیوست: عکس یا PDF پیش‌فاکتور (اختیاری)</label><input class="in" type="file" data-k="file" accept="image/*,application/pdf" style="padding-top:10px">
    <label class="f">توضیح</label><input class="in" data-k="note" maxlength="120" autocomplete="off">
    <button type="button" class="btn p w" data-addq="${esc(iq.id)}">افزودن پیش‌فاکتور</button><div class="msg" data-qm="${esc(iq.id)}"></div></div>`; }
function decHTML(iq){ const dec=iq.dec||{};
  if(iq.st==='ok'){ const q=id=>(iq.quotes.find(x=>x.id===id)||{}).sup||'?';
    const lines=dec.mode==='sup'?[`همه اقلام از <b>${esc(q(dec.sup))}</b>`]:iq.items.map(it=>dec.per&&dec.per[it.id]?`${esc(it.t)}: <b>${esc(q(dec.per[it.id]))}</b>`:`${esc(it.t)}: <span class="na">خرید نشود</span>`);
    return `<div class="dec"><h3>تایید شد — ${esc(dec.by||'')} ${fa(dec.at||'')}</h3>${lines.join('<br>')}${dec.note?`<div class="hint">${esc(dec.note)}</div>`:''}
      ${canW&&canWT('لیست خرید')&&!iq.inList?`<button type="button" class="btn s g" data-tolist="${esc(iq.id)}" style="margin-top:8px">افزودن به لیست خرید هفتگی</button>`:(iq.inList?'<div class="hint">به لیست خرید هفتگی اضافه شد.</div>':'')}</div>`; }
  if(iq.st==='no') return `<div class="dec"><h3>رد شد — ${esc(dec.by||'')} ${fa(dec.at||'')}</h3>${dec.note?esc(dec.note):''}</div>`;
  if(iq.st==='wait' && AP && iq.quotes.length) return `<div class="dec"><h3>تصمیم مدیر</h3><p class="hint">یک فروشنده برای همه اقلام، یا در جدول روی قیمت هر قلم بزنید تا فروشنده همان قلم انتخاب شود.</p>
      <div class="chips">${iq.quotes.map(q=>`<button type="button" class="cp sm" data-apsup="${esc(q.id)}">همه از ${esc(q.sup)}</button>`).join('')}</div>
      <div class="chips"><button type="button" class="cp sm" data-apmix="1">هر قلم ارزان‌ترین</button></div>
      <input class="in" data-apnote placeholder="توضیح (اختیاری)" maxlength="120" style="margin-top:8px">
      <div class="row2" style="margin-top:8px"><button type="button" class="btn g" data-apok="${esc(iq.id)}">تایید انتخاب</button><button type="button" class="btn d" data-apno="${esc(iq.id)}">رد استعلام</button></div><div class="msg" data-am="${esc(iq.id)}"></div></div>`;
  if(iq.st==='wait') return '<div class="dec"><h3>منتظر تایید مدیر</h3><div class="hint">مهندس تایید‌کننده در همین صفحه تصمیم می‌گیرد.</div></div>';
  return canW?`<button type="button" class="btn p w" data-send="${esc(iq.id)}" ${iq.quotes.length?'':'disabled'}>فرستادن برای تایید مدیر</button>`:''; }
let pick={};   /* انتخاب مدیر در حال تصمیم: {iqId:{mode,sup,per}} */
function iqHTML(iq){ const on=OPEN.has(iq.id), F=files();
  return `<div class="iq" data-iq="${esc(iq.id)}"><button type="button" class="h" aria-expanded="${on}"><span class="tx"><b>${esc(iq.title)}</b><span>${fa(iq.items.length)} قلم، ${fa(iq.quotes.length)} پیش‌فاکتور، ${fa(iq.date)}${iq.by?'، '+esc(iq.by):''}</span></span><span class="stt ${esc(iq.st||'')}">${ST[iq.st||'']}</span></button>
    ${on?`<div class="bd">${cmpHTML(iq)}
      ${iq.quotes.length?`<div>${iq.quotes.map(q=>`${q.fid&&F[q.fid]?`<button type="button" class="fl" data-fv="${esc(q.fid)}">📎 ${esc(q.sup)} (${F[q.fid].t==='application/pdf'?'PDF':'عکس'})</button>`:''}${canW&&!iq.st?`<button type="button" class="fl" data-dq="${esc(iq.id)}|${esc(q.id)}">✕ حذف ${esc(q.sup)}</button>`:''}`).join('')}</div>`:''}
      ${!iq.st&&canW?quoteForm(iq):''}${decHTML(iq)}
      ${canW&&(iq.st===''||iq.st==='no')?`<button type="button" class="btn s d" data-del="${esc(iq.id)}" style="margin-top:10px">حذف استعلام</button>`:''}</div>`:''}</div>`; }
function drawAll(){ const A=all().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const O=A.filter(x=>!x.st||x.st==='wait'||(x.st==='ok'&&!x.inList&&daysSince(x.dec&&x.dec.at||x.date)<15)), C=A.filter(x=>!O.includes(x));
  O.sort((a,b)=>(b.st==='wait'?1:0)-(a.st==='wait'?1:0));
  $('oList').innerHTML=(O.length?O.map(iqHTML).join(''):'<div class="card"><div class="empty">استعلام جاری نیست. «استعلام تازه» را بزنید.</div></div>')+`<datalist id="supL">${supList().map(s=>`<option value="${esc(s)}"></option>`).join('')}</datalist>`;
  $('cList').innerHTML=C.length?C.slice(0,60).map(iqHTML).join(''):'<div class="card"><div class="empty">—</div></div>';
  $('nRo').hidden=canW; markPicks(); }
function supList(){ const L=LS('nt_factor_lex_v1',{}), s=new Map(); const add=v=>{ v=clean(v,80); const k=nkey(v); if(k&&!s.has(k)) s.set(k,v); };
  all().forEach(x=>x.quotes.forEach(q=>add(q.sup))); (Array.isArray(L.sup)?L.sup:[]).forEach(add); return [...s.values()].slice(0,800); }
function markPicks(){ Object.keys(pick).forEach(id=>{ const P=pick[id], el=document.querySelector(`.iq[data-iq="${CSS.escape(id)}"]`); if(!el) return; const iq=all().find(x=>x.id===id); if(!iq) return;
  el.querySelectorAll('.cmp tbody tr').forEach((tr,ri)=>{ const it=iq.items[ri]; tr.querySelectorAll('td').forEach((td,ci)=>{ if(!ci) return; const q=iq.quotes[ci-1]; if(!it||!q) return; td.classList.toggle('pick',P.mode==='sup'?P.sup===q.id:(P.per&&P.per[it.id]===q.id)); }); }); }); }
/* پیوست: عکس → webp کوچک (≤۱۵۰KB)، PDF ≤۵۰۰KB؛ در اطلاعات مشترک (رمزدار) تا مدیر روی گوشی خودش ببیند */
function readAs(f,how){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r[how](f); }); }
async function packFile(f){ if(!f) return null;
  if(f.type==='application/pdf'){ if(f.size>500*1024) throw new Error('pdf'); const d=await readAs(f,'readAsDataURL'); return {t:'application/pdf',d:String(d).split(',')[1]}; }
  if(!/^image\//.test(f.type)) throw new Error('type');
  const u=URL.createObjectURL(f), im=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=u; });
  let M=1300, q=.62, out=null; for(let k=0;k<6;k++){ const s=Math.min(1,M/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    out=c.toDataURL('image/webp',q); if(out.length*0.75<=150*1024) break; M*=.82; q=Math.max(.4,q-.06); }
  URL.revokeObjectURL(u); if(out.length*0.75>160*1024) throw new Error('img'); return {t:out.slice(5,out.indexOf(';')),d:out.split(',')[1]}; }
document.addEventListener('click',async e=>{ const b=e.target.closest('button'); if(!b) return;
  const card=b.closest('.iq'), id=card&&card.dataset.iq;
  if(b.classList.contains('h')){ if(OPEN.has(id)) OPEN.delete(id); else OPEN.add(id); drawAll(); return; }
  if(b.dataset.addq){ const f=b.closest('.qt'), sup=clean(f.querySelector('[data-k=sup]').value,80); if(!sup){ say_q(id,'نام فروشنده را بنویسید',1); return; }
    const prices={}; f.querySelectorAll('[data-it]').forEach(i=>{ const v=parseAmt(i.value); if(v!==null) prices[i.dataset.it]=v; });
    if(!Object.keys(prices).length){ say_q(id,'دست‌کم قیمت یک قلم را بنویسید',1); return; }
    let fid=''; const fi=f.querySelector('[data-k=file]').files[0];
    if(fi){ try{ const p=await packFile(fi); fid=uid('F'); const F=files(); F[fid]=Object.assign(p,{at:TODAY,iq:id}); if(!put(FK,F)){ say_q(id,'پیوست ذخیره نشد (حافظه)',1); return; } }
      catch(x){ say_q(id,x.message==='pdf'?'PDF بزرگ‌تر از ۵۰۰ کیلوبایت است':'پیوست خوانده نشد',1); return; } }
    save(A=>{ const iq=A.find(x=>x.id===id); iq.quotes.push({id:uid('q'),sup,date:normDate(f.querySelector('[data-k=date]').value)||TODAY,prices,fid,note:clean(f.querySelector('[data-k=note]').value,120),by:myName()}); }); return; }
  if(b.dataset.dq){ const [i,q]=b.dataset.dq.split('|'); save(A=>{ const iq=A.find(x=>x.id===i); const Q=iq.quotes.find(x=>x.id===q); if(Q&&Q.fid){ const F=files(); delete F[Q.fid]; put(FK,F); } iq.quotes=iq.quotes.filter(x=>x.id!==q); }); return; }
  if(b.dataset.send){ save(A=>{ const iq=A.find(x=>x.id===b.dataset.send); iq.st='wait'; iq.sent=TODAY; }); return; }
  if(b.dataset.apsup){ pick[id]={mode:'sup',sup:b.dataset.apsup}; card.querySelectorAll('[data-apsup],[data-apmix]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); markPicks(); return; }
  if(b.dataset.apmix){ const iq=all().find(x=>x.id===id), B=best(iq), per={}; iq.items.forEach(it=>{ if(B.per[it.id]) per[it.id]=B.per[it.id].q; }); pick[id]={mode:'item',per}; card.querySelectorAll('[data-apsup],[data-apmix]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); markPicks(); return; }
  if(b.dataset.apok){ const P=pick[id]; const m=card.querySelector('[data-am]'); if(!P){ if(m){ m.textContent='اول یک فروشنده یا «هر قلم ارزان‌ترین» را بزنید'; m.className='msg bad'; } return; }
    const note=clean(card.querySelector('[data-apnote]').value,120);
    save(A=>{ const iq=A.find(x=>x.id===id); iq.st='ok'; iq.dec=Object.assign({},P,{by:myName()||'مدیر',at:TODAY,note}); }); delete pick[id]; return; }
  if(b.dataset.apno){ const note=clean(card.querySelector('[data-apnote]').value,120); save(A=>{ const iq=A.find(x=>x.id===id); iq.st='no'; iq.dec={by:myName()||'مدیر',at:TODAY,note}; }); return; }
  if(b.dataset.tolist){ const iq=all().find(x=>x.id===b.dataset.tolist), d=iq.dec||{}, q=i=>(iq.quotes.find(x=>x.id===i)||{}); const W=LS(WK,[]), A2=Array.isArray(W)?W:[];
    let w=A2.filter(x=>x&&!x.arch&&Array.isArray(x.items)).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]; if(!w){ w={id:uid('W'),title:'خرید هفتگی '+TODAY,date:TODAY,by:myName(),items:[]}; A2.push(w); }
    iq.items.forEach(it=>{ const qid=d.mode==='sup'?d.sup:(d.per&&d.per[it.id]); if(!qid) return; const Q=q(qid), p=Q.prices&&Q.prices[it.id];
      w.items.push({id:uid('w'),t:clean(`${it.t}${it.q?' '+it.q+' '+(it.u||''):''} — از ${Q.sup}${p!=null?' ('+g3(p)+' ریال)':''}`,120)}); });
    put(WK,A2); save(A=>{ A.find(x=>x.id===iq.id).inList=TODAY; }); return; }
  if(b.dataset.del){ const i=b.dataset.del; armDel(b,i); return; }
  if(b.dataset.fv){ const F=files()[b.dataset.fv]; if(!F) return; const bin=atob(F.d), u8=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) u8[k]=bin.charCodeAt(k);
    const url=URL.createObjectURL(new Blob([u8],{type:F.t}));
    if(F.t==='application/pdf'){ const a=document.createElement('a'); a.href=url; a.download='pishfactor.pdf'; document.body.appendChild(a); a.click(); setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); },5000); }
    else { $('fv').querySelector('img').src=url; $('fv').hidden=false; } return; }
});
/* انتخاب فروشنده هر قلم با زدن روی قیمت (فقط مدیر، در حال تصمیم) */
document.addEventListener('click',e=>{ const td=e.target.closest('.cmp td'); if(!td||!AP) return; const card=td.closest('.iq'), id=card.dataset.iq, iq=all().find(x=>x.id===id); if(!iq||iq.st!=='wait') return;
  const tr=td.parentElement, ri=[...tr.parentElement.children].indexOf(tr), ci=[...tr.children].indexOf(td); const it=iq.items[ri], q=iq.quotes[ci-1]; if(!it||!q||lineTot(it,q)==null) return;
  const P=pick[id]&&pick[id].mode==='item'?pick[id]:{mode:'item',per:{}}; if(pick[id]&&pick[id].mode==='sup'){ iq.items.forEach(x=>{ if(lineTot(x,iq.quotes.find(y=>y.id===pick[id].sup))!=null) P.per[x.id]=pick[id].sup; }); }
  P.per[it.id]=q.id; pick[id]=P; card.querySelectorAll('[data-apsup],[data-apmix]').forEach(x=>x.setAttribute('aria-pressed','false')); markPicks(); });
function say_q(id,t,bad){ const m=document.querySelector(`[data-qm="${CSS.escape(id)}"]`); if(m){ m.textContent=t; m.className='msg'+(bad?' bad':' ok'); } }
const armed=new Map();
function armDel(b,id){ if(armed.get(id)){ armed.delete(id); const iq=all().find(x=>x.id===id); const F=files(); (iq?iq.quotes:[]).forEach(q=>{ if(q.fid) delete F[q.fid]; }); put(FK,F); save(A=>{ const i=A.findIndex(x=>x.id===id); if(i>-1) A.splice(i,1); }); return; }
  armed.set(id,1); b.textContent='حذف؟ دوباره بزنید'; b.classList.add('armed'); setTimeout(()=>{ armed.delete(id); },5000); }
$('fvX').addEventListener('click',()=>{ $('fv').hidden=true; });
document.addEventListener('input',e=>{ if(e.target.classList&&e.target.classList.contains('dt')) maskDate(e.target); });
/* پاک‌سازی: پیوست استعلام‌هایی که ۶۰ روز پیش تصمیم گرفته شده‌اند */
(function(){ if(!canW) return; const A=all(), F=files(); let n=0; A.forEach(iq=>{ if((iq.st==='ok'||iq.st==='no') && iq.dec && daysSince(iq.dec.at)>60) iq.quotes.forEach(q=>{ if(q.fid && F[q.fid]){ delete F[q.fid]; n++; } }); });
  Object.keys(F).forEach(k=>{ if(!A.some(iq=>iq.quotes.some(q=>q.fid===k))){ delete F[k]; n++; } }); if(n) put(FK,F); })();
const S=segInit('seg','ntp_pane',['open','new','old'],p=>{ if(p!=='new') drawAll(); });
$('goNew').addEventListener('click',()=>{ S.set('new'); try{ $('nT').focus(); }catch(e){} });
window.addEventListener('storage',e=>{ if(!e.key||[PK,FK].includes(e.key)){ if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; drawAll(); } });
</script>
