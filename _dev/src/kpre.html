<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F1EC">
<title>پیش‌فاکتور</title>
<style>
/*KH_COMMON_CSS*/
.iq{background:#fff;border:1px solid var(--rule);border-radius:18px;margin-top:14px;overflow:hidden}
.iq>button.h{display:flex;align-items:flex-start;gap:10px;width:100%;padding:18px 16px 4px;border:0;background:none;text-align:start;color:var(--ink)}
.iq>button.h .tx{flex:1;min-width:0}
.iq>button.h b{display:block;font-size:1.25rem;font-weight:900;line-height:1.5}
.iq>button.h span.m{display:block;font-size:.9rem;color:#4E5864;margin-top:2px}
.iq .bd{padding:0 16px 16px}
.stt{flex:none;font-size:.88rem;font-weight:900;padding:6px 14px;border-radius:10px;background:var(--soft);color:#4E5864;white-space:nowrap}
.stt.wait{background:var(--ambg);color:var(--amt)}.stt.ok{background:var(--okbg);color:var(--ok)}.stt.no{background:var(--badbg);color:var(--bad)}
.sups{display:grid;gap:8px;margin-top:14px}
.sups .fl{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 8px;border:0;border-radius:12px;background:var(--soft);font-weight:900;font-size:.95rem;color:var(--ink);min-width:0}
.sups .fl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sups .fl .ico svg{width:18px;height:18px;stroke-width:2.4}
.ib{border-top:1px solid var(--rule);margin:14px -16px 0;padding:12px 16px 0}
.ib .ih{display:flex;align-items:baseline;gap:8px}
.ib .ih b{flex:1;font-size:1.08rem;font-weight:900}
.ib .ih span{color:#4E5864;font-size:.9rem}
.cells{display:grid;gap:8px;margin-top:10px}
.cl{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px;padding:6px 4px;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font:inherit;min-width:0}
.cl b{font-size:clamp(.86rem,3.7vw,1.1rem);font-weight:900;line-height:1.35;direction:ltr;unicode-bidi:isolate}
.cl small{font-size:.84rem;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.cl.best{background:var(--okbg);color:var(--ok)}.cl.best small{color:var(--ok)}
.cl.na b{color:#6B7178}.cl.na small{color:#6B7178;font-weight:700}
.cl.pick{box-shadow:inset 0 0 0 3px var(--nv)}
.tots{border-top:2px solid var(--nv);margin:14px -16px 0;padding:12px 16px 0}
.tots .cl{background:none;min-height:54px}
.tots .cl small{font-weight:600;color:#4E5864}
.lg{font-size:.88rem;color:#4E5864;margin-top:10px;text-align:center}
.lg b{color:var(--ink)}
details.bxw{margin-top:14px;border:1px solid var(--rule);border-radius:14px;background:#fff;overflow:hidden}
details.bxw summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:58px;padding:0 14px;cursor:pointer;font-weight:900;font-size:1.02rem}
details.bxw summary::-webkit-details-marker{display:none}
details.bxw summary .t{flex:1}
details.bxw summary small{font-weight:900;font-size:.82rem;color:#fff;background:var(--nv);padding:3px 12px;border-radius:12px}
details.bxw summary small:empty{display:none}
details.bxw summary .cv{transition:transform .2s}
details.bxw[open] summary .cv{transform:rotate(180deg)}
details.bxw .bd2{border-top:1px solid var(--rule)}
.bxp{display:flex;gap:14px;align-items:center;min-height:60px;padding:8px 14px;border-top:1px solid var(--rule);cursor:pointer}
.bxp:first-child{border-top:0}
.bxp input{position:absolute;opacity:0;width:1px;height:1px}
.bxp .cbx{flex:none;width:36px;height:36px;border-radius:9px;border:2px solid #4E5864;display:grid;place-items:center;color:#fff;background:#fff}
.bxp input:checked+.cbx{background:var(--nv);border-color:var(--nv)}
.bxp input:focus-visible+.cbx{outline:2px solid var(--am);outline-offset:2px}
.bxp .cbx svg{width:22px;height:22px}
.bxp .t{flex:1;min-width:0}
.bxp .t b{display:block;font-weight:900;font-size:.98rem}
.bxp .t span{display:block;font-size:.84rem;color:#4E5864}
.qt{border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;margin-top:14px;background:#FBFAF7}
.qt>b{font-weight:900}
.th{display:grid;gap:8px;margin-top:10px;padding:0 2px 4px;border-bottom:1.5px solid var(--line);font-size:.8rem;font-weight:900;color:#4E5864}
.qt .th,.qt .pr{grid-template-columns:1fr 62px minmax(128px,42%)}
.qt .pr{display:grid;gap:4px 8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.qt .pr>span{font-size:.92rem;overflow-wrap:anywhere}.qt .pr>i{font-style:normal;font-size:.88rem;color:#4E5864}
.qt .pr .in{margin:0;min-height:46px;padding:0 10px;text-align:left;direction:ltr}
.mw{grid-column:1/-1;font-size:.8rem;color:#4E5864;line-height:1.6;min-height:0}.mw:empty{display:none}.mw b{color:var(--ink);font-weight:900}
.nrs .th,.nr{grid-template-columns:1fr 60px 80px 40px}
.nr{display:grid;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.nr .in{margin:0;min-height:46px;padding:0 8px}
.nr .np{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.nr .np span{font-size:.8rem;font-weight:800;color:#4E5864}
.nr .np .in{text-align:left;direction:ltr}
.nr .x{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:900;color:var(--bad)}
.ch{font-size:.8rem;font-weight:900;color:#4E5864;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cl .uq{font-size:.74rem;font-weight:700;color:#4E5864}.cl.best .uq{color:var(--ok)}
.dec{margin-top:16px;padding:16px;border-radius:16px;border:2px solid var(--am);background:#fff}
.dec h3{margin:0 0 6px;font-size:1.05rem;font-weight:900}
.dec .na{color:#6B7178}
.ie{display:grid;grid-template-columns:1fr 78px 92px 40px;gap:6px;align-items:center;margin-top:8px}
.ie span{font-size:.92rem;overflow-wrap:anywhere}.ie small{display:block;color:#4E5864;font-size:.76rem}
.ie .in{margin:0;min-height:46px;padding:0 8px}
.ie .x{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:900;color:var(--bad)}
details.ed{margin-top:14px}
details.ed summary{min-height:48px;display:flex;align-items:center;font-weight:900;cursor:pointer;color:var(--ink)}
.qdel{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.qdel .qr{display:flex;align-items:center;gap:8px;padding:4px 0}.qdel .qr b{flex:1;min-width:0;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qdel button.qe{color:var(--nv);border-color:var(--nv)}
.qt.edit{border-style:solid;border-color:var(--nv);background:#F3F6FA}
.qdel button{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:38px;padding:0 12px;color:var(--bad);font-weight:800;font-size:.84rem}
#fv{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.92);display:flex;align-items:center;justify-content:center;padding:12px}
#fv img{max-width:100%;max-height:100%;border-radius:8px}
#fv button{position:absolute;top:12px;inset-inline-end:12px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="tt"><h1>پیش‌فاکتور</h1><p class="sub" id="hSub">استعلام قیمت از چند فروشنده، مقایسه و تایید مدیر</p></div></header>
<div class="seg" id="seg" role="group" aria-label="بخش">
  <button type="button" data-p="open" aria-pressed="true">جاری<span class="n" id="nOpen"></span></button>
  <button type="button" data-p="new" aria-pressed="false">استعلام تازه</button>
  <button type="button" data-p="old" aria-pressed="false">بسته‌شده</button>
</div>
<button type="button" id="goNew" hidden></button>

<section id="p_new" hidden>
  <div class="card w-only">
    <label class="f" for="nT" style="margin-top:0">عنوان استعلام</label>
    <input class="in fill" id="nT" maxlength="80" autocomplete="off" placeholder="مثلاً: مواد غذایی آبان">
    <details id="nBoxW" class="bxw" hidden open><summary><span id="nBoxI"></span><span class="t">از باکس سندپرداز</span><small id="nBoxN"></small><span class="cv" id="nBoxC"></span></summary>
      <div class="bd2"><div style="padding:10px 14px 4px"><input class="in" id="nBoxQ" placeholder="جستجو در اقلام باز باکس" autocomplete="off" style="margin:0"></div><div id="nBox"></div></div></details>
    <label class="f">اقلام</label><p class="hint" style="margin-top:2px">قیمت کل هر قلم را بنویسید (اختیاری)؛ قیمت واحد را سامانه حساب می‌کند.</p>
    <div class="nrs"><div class="th"><span>عنوان کالا</span><span>تعداد</span><span>واحد</span><span></span></div><div id="nRows"></div></div>
    <button type="button" class="btn s" id="nAdd" style="margin-top:8px">+ ردیف دیگر</button>
    <label class="f" for="nSup">فروشنده (اگر قیمت نوشتید)</label><input class="in fill" id="nSup" maxlength="80" list="supL" autocomplete="off">
    <details class="ed" id="nPasteW"><summary>چسباندن فهرست چندخطی</summary><p class="hint" style="margin-top:2px">هر خط یک قلم؛ تعداد و واحد بعد از نام</p>
    <textarea class="in fill" id="nI" rows="4" placeholder="برنج ۱۰ کیسه&#10;روغن ۵ حلب&#10;رب گوجه ۲۰ قوطی"></textarea></details>
    <button type="button" class="btn p w" id="nSave">ساخت استعلام</button>
    <div class="msg" id="nMsg" role="status"></div>
  </div>
  <div class="card" id="nRo" hidden><div class="empty">اجازه ساخت استعلام ندارید.</div></div>
</section>
<section id="p_open"><div id="oList"></div></section>
<section id="p_old" hidden><div id="cList"></div></section>
</div>
<div id="fv" hidden><img alt="پیوست پیش‌فاکتور"><button type="button" class="btn s" id="fvX">بستن</button></div>
<script>
/*KH_COMMON_JS*/
const PK=agK('nt_kpre_v1'), FK=agK('nt_kpre_files_v1'), WK='nt_kweek_v1', BXK=agK('nt_kbox_v1');
const TAB='پیش‌فاکتور', canW=canWT(TAB), AP=canAppr();
if(!canW) document.body.classList.add('ro');
const all=()=>{ const a=LS(PK,[]); return Array.isArray(a)?a.filter(x=>x&&x.id&&Array.isArray(x.items)):[]; };
const files=()=>{ const o=LS(FK,{}); return (o&&typeof o==='object'&&!Array.isArray(o))?o:{}; };
function save(fn){ const A=all(); fn(A); if(!put(PK,A)) return false; drawAll(); return true; }
const ST={'':'پیش‌نویس',wait:'منتظر تایید',ok:'تایید شد',no:'رد شد'};
const UNITS=['عدد','کیسه','حلب','قوطی','کیلوگرم','لیتر','بسته','کارتن','متر','دست','شاخه','گالن'];
/* مبلغ مثل بانک: جداکننده هنگام نوشتن و مبلغ به حروف */
const W1=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'], W10=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'], W11=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'], W100=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'], WSC=['','هزار','میلیون','میلیارد','هزار میلیارد'];
function wd3(n){ const p=[], s=Math.floor(n/100), r=n%100; if(s) p.push(W100[s]); if(r>=10&&r<20) p.push(W11[r-10]); else { const d=Math.floor(r/10), y=r%10; if(d) p.push(W10[d]); if(y) p.push(W1[y]); } return p.join(' و '); }
function rialWords(n){ n=Math.floor(+n||0); if(!n) return 'صفر'; const P=[]; let i=0; while(n>0&&i<WSC.length){ const c=n%1000; if(c) P.unshift(wd3(c)+(WSC[i]?' '+WSC[i]:'')); n=Math.floor(n/1000); i++; } return P.join(' و '); }
function mnyFmt(el){ const at=el.selectionStart===el.value.length; let d=lat(el.value).replace(/[^\d]/g,'').replace(/^0+(?=\d)/,'').slice(0,15); const v=d?fa(g3(d)):''; if(v!==el.value){ el.value=v; if(at) try{ el.setSelectionRange(v.length,v.length); }catch(e){} } }
/** زیر کادر: به حروف + قیمت واحد (قیمت کل ÷ تعداد) */
function mnyNote(el){ const w=el.closest('.pr,.nr'), m=w&&w.querySelector('.mw'); if(!m) return; const n=parseAmt(el.value); if(n===null||!n){ m.innerHTML=''; return; }
  const qEl=w.querySelector('[data-n=q]'), q=+(qEl?parseAmt(qEl.value):el.dataset.q)||0;
  m.innerHTML=esc(rialWords(n))+' ریال'+(q>1?`<br>قیمت واحد: <b>${esc(faN(n/q))}</b> ریال`:''); }
document.addEventListener('input',e=>{ const t=e.target; if(t.classList&&t.classList.contains('mny')){ mnyFmt(t); mnyNote(t); } else if(t.dataset&&t.dataset.n==='q'){ const v=fa(lat(t.value).replace(/[^\d.]/g,'')); if(v!==t.value) t.value=v; const m=t.closest('.nr').querySelector('.mny'); if(m) mnyNote(m); } });
const unitOf=(tot,q)=>Math.round(tot/((+q)||1));
function nRow(x){ x=x||{}; const d=document.createElement('div'); d.className='nr'; d.innerHTML=`<input class="in" data-n="t" maxlength="120" autocomplete="off" aria-label="عنوان کالا" value="${esc(x.t||'')}"><input class="in mono" data-n="q" inputmode="decimal" aria-label="تعداد" value="${esc(x.q?fa(x.q):'')}"><input class="in" data-n="u" maxlength="15" list="unitL" aria-label="واحد" value="${esc(x.u||'')}"><button type="button" class="x" data-nx aria-label="حذف ردیف">×</button>
  <label class="np"><span>قیمت کل (ریال)</span><input class="in mono mny" data-n="p" inputmode="numeric" autocomplete="off" aria-label="قیمت کل به ریال"></label><div class="mw" aria-live="polite"></div>`; $('nRows').appendChild(d); return d; }
function nReset(){ $('nRows').innerHTML=''; for(let k=0;k<3;k++) nRow(); }
$('nAdd').addEventListener('click',()=>{ nRow().querySelector('input').focus(); });
$('nRows').addEventListener('click',e=>{ const b=e.target.closest('[data-nx]'); if(!b) return; const r=b.closest('.nr'); if($('nRows').children.length>1) r.remove(); else r.querySelectorAll('input').forEach(i=>i.value=''), r.querySelector('.mw').innerHTML=''; });
/* متن چسبانده: هر خط یک ردیف جدول */
$('nI').addEventListener('change',()=>{ const L=String($('nI').value).split(/\r?\n/).map(parseLine).filter(x=>x.t); if(!L.length) return; [...$('nRows').children].forEach(r=>{ if(![...r.querySelectorAll('input')].some(i=>i.value.trim())) r.remove(); }); L.slice(0,60).forEach(nRow); $('nI').value=''; $('nPasteW').open=false; });
nReset();
/** «برنج ۱۰ کیسه» → {t:'برنج',q:10,u:'کیسه'} */
function parseLine(l){ l=clean(l,120); const m=/^(.*?)[\s\-:]+([\d۰-۹٠-٩.,/]+)\s*([^\d\s]*)$/.exec(l); if(m && m[1].trim()) return {t:m[1].trim(),q:+lat(m[2]).replace(/,/g,'')||'',u:clean(m[3],15)}; return {t:l,q:'',u:''}; }
$('nSave').addEventListener('click',()=>{ const T=clean($('nT').value,80)||('استعلام '+fa(TODAY)), L=String($('nI').value).split(/\r?\n/).map(parseLine).filter(x=>x.t);
  const R=[...$('nRows').children].map(r=>{ const v=k=>r.querySelector(`[data-n=${k}]`).value; return {t:clean(v('t'),120),q:parseAmt(v('q'))||'',u:clean(v('u'),15),p:parseAmt(v('p'))}; }).filter(x=>x.t);
  const BX=freeBox().filter(x=>nSel.has(x.id)).map(x=>({t:clean(x.name,120),q:parseAmt(x.qty)??'',u:clean(x.unit,15),code:clean(x.code,30),bx:x.id}));
  if(!L.length && !BX.length && !R.length){ say('nMsg','اقلام را بنویسید یا از باکس انتخاب کنید','bad'); return; }
  const priced=R.filter(x=>x.p), sup=clean($('nSup').value,80);
  if(priced.length && !sup){ say('nMsg','قیمت نوشتید؛ نام فروشنده را هم بنویسید','bad'); $('nSup').focus(); return; }
  const items=BX.concat(R,L).slice(0,60).map(x=>{ const o=Object.assign({id:uid('i')},x); delete o.p; o._p=x.p; return o; });
  const lt={}, prices={}; items.forEach(it=>{ if(it._p){ lt[it.id]=it._p; prices[it.id]=unitOf(it._p,it.q); } delete it._p; });
  const quotes=priced.length?[{id:uid('q'),sup,date:TODAY,lt,prices,fid:'',note:'',by:myName()}]:[];
  const id=uid('p'); save(A=>A.push({id,title:T,date:TODAY,by:myName(),items,quotes,st:''}));
  $('nT').value=''; $('nI').value=''; $('nSup').value=''; nReset(); say('nMsg',''); nSel.clear(); OPEN.add(id); S.set('open'); });
/* اقلام باز باکس سندپرداز که در استعلام جاری یا تاییدشده‌ای نیستند */
const nSel=new Set();
function freeBox(){ if(!canSeeT('باکس سندپرداز')) return []; const B=LS(BXK,[]), used=new Set(); all().forEach(iq=>{ if(iq.st!=='no') iq.items.forEach(it=>{ if(it.bx) used.add(it.bx); }); });
  return (Array.isArray(B)?B:[]).filter(x=>x&&x.id&&x.name&&!x.st&&!x.gone&&!used.has(x.id)).sort((a,b)=>(b.imp?1:0)-(a.imp?1:0)); }
function drawNBox(){ const F=freeBox(), q=norm($('nBoxQ').value).split(' ').filter(Boolean); $('nBoxW').hidden=!F.length||!canW; $('nBoxN').textContent=nSel.size?fa(nSel.size)+' انتخاب':'';
  const L=q.length?F.filter(x=>{ const h=norm([x.name,x.code,x.memo].join(' ')); return q.every(w=>h.indexOf(w)>-1); }):F;
  $('nBoxQ').parentElement.hidden=F.length<=6;
  $('nBox').innerHTML=L.slice(0,200).map(x=>`<label class="bxp"><input type="checkbox" data-nb="${esc(x.id)}" ${nSel.has(x.id)?'checked':''}><span class="cbx">${CHK}</span><span class="t"><b>${esc(x.name)}</b><span>${[x.code?'کد '+esc(fa(x.code)):'',esc(fa(x.qty||''))+' '+esc(x.unit||'')].filter(s=>s.trim()).join('، ')}</span></span></label>`).join('')||'<div class="empty">—</div>'; }
$('nBox').addEventListener('change',e=>{ const c=e.target.closest('[data-nb]'); if(!c) return; if(c.checked) nSel.add(c.dataset.nb); else nSel.delete(c.dataset.nb); $('nBoxN').textContent=nSel.size?fa(nSel.size)+' انتخاب':''; });
$('nBoxQ').addEventListener('input',drawNBox);
const OPEN=new Set(), SHUT=new Set();
/** قیمت کل یک قلم در یک پیش‌فاکتور (قیمت واحد × تعداد) */
const lineTot=(it,q)=>{ const t=q.lt&&q.lt[it.id]; if(t!=null&&t!=='') return +t; const p=q.prices&&q.prices[it.id]; if(p==null||p==='') return null; return (+p)*((+it.q)||1); };
function best(iq){ const per={}, tot={}; iq.items.forEach(it=>{ let b=null; iq.quotes.forEach(q=>{ const v=lineTot(it,q); if(v!=null && (b===null||v<b.v)) b={v,q:q.id}; }); per[it.id]=b; });
  iq.quotes.forEach(q=>{ let s=0, n=0; iq.items.forEach(it=>{ const v=lineTot(it,q); if(v!=null){ s+=v; n++; } }); tot[q.id]={s,full:n===iq.items.length,n}; });
  const fulls=iq.quotes.filter(q=>tot[q.id].full); const bs=fulls.length?fulls.reduce((a,q)=>tot[q.id].s<tot[a.id].s?q:a,fulls[0]):null;
  const mix=iq.items.reduce((a,it)=>a+(per[it.id]?per[it.id].v:0),0);
  return {per,tot,bestSup:bs?bs.id:null,mix}; }
/** مقایسه (طرح v2): برای هر قلم یک ردیف خانه (هر فروشنده یک خانه)، ارزان‌ترین سبز؛ جمع هر فروشنده پایین */
function cmpHTML(iq){ if(!iq.quotes.length) return '<div class="empty">هنوز پیش‌فاکتوری اضافه نشده است.</div>';
  const B=best(iq), dec=iq.dec||{}, n=iq.quotes.length, cols=`grid-template-columns:repeat(${Math.min(n,3)},1fr)`;
  const picked=(it,q)=>iq.st==='ok' && (dec.mode==='sup'?dec.sup===q.id:(dec.per&&dec.per[it.id]===q.id));

document.addEventListener('click',e=>{ const td=e.target.closest('.cl[data-it]'); if(!td||!AP) return; const card=td.closest('.iq'), id=card.dataset.iq, iq=all().find(x=>x.id===id); if(!iq||iq.st!=='wait') return;
  const it=iq.items.find(x=>x.id===td.dataset.it), q=iq.quotes.find(x=>x.id===td.dataset.q); if(!it||!q||lineTot(it,q)==null) return;
  const P=pick[id]&&pick[id].mode==='item'?pick[id]:{mode:'item',per:{}}; if(pick[id]&&pick[id].mode==='sup'){ iq.items.forEach(x=>{ if(lineTot(x,iq.quotes.find(y=>y.id===pick[id].sup))!=null) P.per[x.id]=pick[id].sup; }); }
  P.per[it.id]=q.id; pick[id]=P; card.querySelectorAll('[data-apsup],[data-apmix]').forEach(x=>x.setAttribute('aria-pressed','false')); markPicks(); });
function say_q(id,t,bad){ const m=document.querySelector(`[data-qm="${CSS.escape(id)}"]`); if(m){ m.textContent=t; m.className='msg'+(bad?' bad':' ok'); } }
const armed=new Map();
function armDel(b,id){ if(armed.get(id)){ armed.delete(id); const iq=all().find(x=>x.id===id); const F=files(); (iq?iq.quotes:[]).forEach(q=>{ if(q.fid) delete F[q.fid]; }); put(FK,F); save(A=>{ const i=A.findIndex(x=>x.id===id); if(i>-1) A.splice(i,1); }); return; }
  armed.set(id,1); const t0=b.textContent; b.textContent='حذف؟ دوباره بزنید'; b.classList.add('armed'); setTimeout(()=>{ armed.delete(id); if(b.isConnected){ b.textContent=t0; b.classList.remove('armed'); } },5000); }

(function(){ if(!canW) return; const A=all(), F=files(); let n=0; A.forEach(iq=>{ if((iq.st==='ok'||iq.st==='no') && iq.dec && daysSince(iq.dec.at)>60) iq.quotes.forEach(q=>{ if(q.fid && F[q.fid]){ delete F[q.fid]; n++; } }); });
  Object.keys(F).forEach(k=>{ if(!A.some(iq=>iq.quotes.some(q=>q.fid===k))){ delete F[k]; n++; } }); if(n) put(FK,F); })();
